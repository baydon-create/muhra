<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Muhra HQ</title>
<meta name="theme-color" content="#3B2A20">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Muhra HQ">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="https://cdn.shopify.com/s/files/1/0679/6984/3251/files/MUHRA_APP_LOGO_1.png?v=1777552159">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{
  --brown:#5C3D2E;--brown-d:#3B2A20;--brown-l:#8A6A55;
  --beige:#EFE4D6;--beige-l:#F7F1EA;--cream:#FCFAF7;
  --ink:#2B1F18;--muted:#8C7B6E;--line:#E6DACB;
  --ok:#3F7A57;--ok-bg:#E5F0E8;--warn:#B7791F;--warn-bg:#FBF0DC;--bad:#B3443A;--bad-bg:#F8E3E0;
  --radius:14px;--shadow:0 1px 2px rgba(59,42,32,.06),0 4px 14px rgba(59,42,32,.06);
  --nav-h:64px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--cream);color:var(--ink);font-family:'Tajawal','Montserrat',system-ui,sans-serif;font-size:15px;line-height:1.5}
.lat{font-family:'Montserrat',sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--brown)}
.hidden{display:none!important}

/* layout */
header.top{position:sticky;top:0;z-index:20;background:var(--brown-d);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px}
header.top .brand{font-family:'Montserrat';font-weight:700;letter-spacing:.16em;font-size:15px}
header.top .brand small{display:block;font-weight:500;letter-spacing:.3em;font-size:9px;opacity:.7}
header.top .sp{flex:1}
main{max-width:1280px;margin:0 auto;padding:14px 14px calc(var(--nav-h) + 90px + env(safe-area-inset-bottom))}
nav.bottom{position:fixed;bottom:0;left:0;right:0;z-index:30;height:calc(var(--nav-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:#fff;border-top:1px solid var(--line);display:flex}
nav.bottom button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11.5px;color:var(--muted);position:relative}
nav.bottom button svg{width:22px;height:22px}
nav.bottom button.on{color:var(--brown);font-weight:700}
nav.bottom .dot{position:absolute;top:8px;left:calc(50% - 18px);min-width:17px;height:17px;border-radius:9px;background:var(--bad);color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center;padding:0 4px;font-family:Montserrat}
.fab{position:fixed;left:18px;bottom:calc(var(--nav-h) + 18px + env(safe-area-inset-bottom));z-index:31;width:56px;height:56px;border-radius:28px;border:0;background:var(--brown);color:#fff;font-size:30px;box-shadow:0 6px 20px rgba(59,42,32,.35);display:flex;align-items:center;justify-content:center}

/* generic */
h2.sec{font-size:16px;margin:22px 2px 10px;display:flex;align-items:center;gap:8px;font-weight:800}
h2.sec .n{font-family:Montserrat;font-size:12px;background:var(--beige);color:var(--brown);border-radius:10px;padding:1px 8px}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.pad{padding:14px}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.row{display:flex;align-items:center;gap:8px}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.btn{border:1px solid var(--line);background:#fff;border-radius:11px;padding:9px 14px;font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn.pri{background:var(--brown);border-color:var(--brown);color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.bad{background:#fff;border-color:var(--bad);color:var(--bad)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:9px}
.btn:disabled{opacity:.5}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:20px;padding:2px 9px;font-size:12px;font-weight:700;background:var(--beige-l);color:var(--brown);border:1px solid var(--line);white-space:nowrap}
.pill.late{background:var(--bad-bg);color:var(--bad);border-color:#EFC7C1}
.pill.soon{background:var(--warn-bg);color:var(--warn);border-color:#F0D9AE}
.pill.okp{background:var(--ok-bg);color:var(--ok);border-color:#C9E0D0}
.av{width:28px;height:28px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:700;font-family:Montserrat;flex:none;background-size:cover;background-position:center}
.av.lg{width:40px;height:40px;font-size:14px}
.empty{padding:22px;text-align:center;color:var(--muted);border:1.5px dashed var(--line);border-radius:var(--radius);background:var(--beige-l)}
.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:#fff;border-radius:20px;padding:7px 13px;font-size:13.5px;font-weight:700;color:var(--muted);display:inline-flex;gap:6px;align-items:center}
.chip.on{background:var(--brown);border-color:var(--brown);color:#fff}
.chip .c{font-family:Montserrat;font-size:11px;opacity:.8}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
select.inp,input.inp,textarea.inp{width:100%;border:1px solid var(--line);border-radius:11px;padding:10px 12px;background:#fff;outline:none}
select.inp:focus,input.inp:focus,textarea.inp:focus{border-color:var(--brown-l);box-shadow:0 0 0 3px rgba(92,61,46,.08)}
textarea.inp{min-height:84px;resize:vertical;line-height:1.6}
select.mini{border:1px solid var(--line);border-radius:10px;padding:7px 10px;background:#fff;font-size:13.5px;font-weight:700}
label.lb{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin:14px 2px 6px}

/* content card */
.ccard{display:flex;gap:11px;padding:11px;align-items:flex-start;cursor:pointer;transition:transform .08s}
.ccard:active{transform:scale(.99)}
.thumb{width:54px;height:72px;border-radius:9px;background:var(--beige) center/cover no-repeat;flex:none;display:flex;align-items:center;justify-content:center;color:var(--brown-l);font-size:20px}
.ccard .t{font-weight:800;font-size:14.5px;line-height:1.35;margin-bottom:5px;word-break:break-word}
.ccard .meta{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.list{display:flex;flex-direction:column;gap:9px}
.stage-tag{font-size:11.5px;font-weight:800;border-radius:6px;padding:1px 7px}

/* kanban */
.kanban{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,1fr);gap:12px;overflow-x:auto;padding-bottom:10px}
.kcol{background:var(--beige-l);border:1px solid var(--line);border-radius:var(--radius);padding:10px;min-height:200px}
.kcol h3{margin:2px 4px 10px;font-size:14px;display:flex;justify-content:space-between}

/* week strip & calendar */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 4px;text-align:center;cursor:pointer}
.wd .d{font-size:11.5px;color:var(--muted);font-weight:700}
.wd .n{font-family:Montserrat;font-weight:700;font-size:16px}
.wd .c{font-size:11px;font-weight:700;margin-top:2px}
.wd.gap{background:var(--bad-bg);border-color:#EFC7C1}
.wd.gap .c{color:var(--bad)}
.wd.today{outline:2px solid var(--brown);outline-offset:-2px}
.calday{margin-bottom:10px}
.calday .hd{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.calday .hd b{font-size:14.5px}
.calday.gap{border-color:#EFC7C1}
.calday.gap .hd{background:var(--bad-bg);border-radius:var(--radius) var(--radius) 0 0}
.calday .bd{padding:8px}
.calday .bd .ccard{border:1px solid var(--line);border-radius:12px;margin-bottom:7px}

/* research */
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.rcard{overflow:hidden;display:flex;flex-direction:column}
.rcard .img{aspect-ratio:4/5;background:var(--beige) center/cover no-repeat;position:relative}
.rcard .img .fmt{position:absolute;top:7px;right:7px;background:rgba(43,31,24,.75);color:#fff;font-size:11px;border-radius:6px;padding:1px 7px;font-family:Montserrat;font-weight:600}
.rcard .img .er{position:absolute;bottom:7px;right:7px;background:var(--brown);color:#fff;font-size:11px;border-radius:6px;padding:1px 7px;font-family:Montserrat;font-weight:700}
.rcard .bd{padding:9px;display:flex;flex-direction:column;gap:6px;flex:1}
.rcard .u{font-family:Montserrat;font-weight:700;font-size:12.5px;direction:ltr;text-align:right}
.rcard .cap{font-size:12px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:36px}
.rcard .st{font-family:Montserrat;font-size:11.5px;color:var(--muted);display:flex;gap:8px}

/* scoreboard */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:9px}
.kpi{padding:12px 14px}
.kpi .v{font-family:Montserrat;font-weight:700;font-size:24px;line-height:1.1}
.kpi .l{font-size:12.5px;color:var(--muted);font-weight:700}
table.tb{width:100%;border-collapse:collapse;font-size:13.5px}
table.tb th{text-align:right;font-size:12px;color:var(--muted);font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line)}
table.tb td{padding:9px 10px;border-bottom:1px solid var(--line)}
table.tb td.num{font-family:Montserrat;font-weight:600}
.tools{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:9px}
.tool{padding:14px;text-decoration:none;color:var(--ink);display:flex;flex-direction:column;gap:5px}
.tool .ic{font-size:22px}
.tool b{font-size:14px}
.tool span{font-size:12px;color:var(--muted)}

/* sheet */
.overlay{position:fixed;inset:0;background:rgba(43,31,24,.42);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--cream);width:100%;max-width:760px;max-height:94vh;border-radius:20px 20px 0 0;overflow:hidden;display:flex;flex-direction:column;animation:up .2s ease}
@media(min-width:900px){.overlay{align-items:center}.sheet{border-radius:20px;max-height:90vh}}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.sheet .sh{padding:12px 14px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line);background:#fff}
.sheet .sb{padding:4px 16px 18px;overflow-y:auto;flex:1}
.sheet .sf{padding:10px 14px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:#fff;display:flex;gap:8px;flex-wrap:wrap}
.sheet .sf .btn{flex:1;min-width:130px}
.titleinp{border:0;background:transparent;font-size:19px;font-weight:800;width:100%;outline:none;padding:12px 2px 4px}
.stepper{display:flex;gap:4px;overflow-x:auto;padding:8px 0 4px;scrollbar-width:none}
.stepper button{flex:none;border:1px solid var(--line);background:#fff;border-radius:9px;padding:6px 9px;font-size:12.5px;font-weight:700;color:var(--muted)}
.stepper button.done{background:var(--beige);color:var(--brown);border-color:var(--beige)}
.stepper button.cur{background:var(--brown);color:#fff;border-color:var(--brown)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.toggles{display:flex;gap:6px;flex-wrap:wrap}
.tg{border:1px solid var(--line);background:#fff;border-radius:20px;padding:6px 12px;font-size:13px;font-weight:700;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.tg.on{background:var(--beige);color:var(--brown);border-color:var(--brown-l)}
.files{display:flex;gap:8px;flex-wrap:wrap}
.file{width:84px;height:84px;border-radius:10px;border:1px solid var(--line);background:#fff center/cover no-repeat;position:relative;display:flex;align-items:center;justify-content:center;text-align:center;font-size:11px;padding:4px;overflow:hidden;word-break:break-all;text-decoration:none;color:var(--ink)}
.file .x{position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:11px;border:0;background:rgba(43,31,24,.7);color:#fff;font-size:13px;line-height:1}
.file.add{border-style:dashed;color:var(--brown);font-size:26px;cursor:pointer}
.alert{border-radius:12px;padding:10px 12px;font-size:13.5px;margin-top:12px;font-weight:600}
.alert.bad{background:var(--bad-bg);color:var(--bad)}
.alert.ok{background:var(--ok-bg);color:var(--ok)}
.alert.warn{background:var(--warn-bg);color:var(--warn)}
.cmt{display:flex;gap:9px;margin:10px 0}
.cmt .bub{background:#fff;border:1px solid var(--line);border-radius:4px 14px 14px 14px;padding:8px 11px;flex:1;min-width:0}
.cmt .bub .who{font-weight:800;font-size:12.5px}
.cmt .bub .tm{font-size:11px;color:var(--muted);font-family:Montserrat}
.cmt .bub p{margin:3px 0 0;white-space:pre-wrap;word-break:break-word;font-size:14px}
.act{font-size:12.5px;color:var(--muted);padding:4px 0;border-bottom:1px dashed var(--line)}
.linkrow{display:flex;gap:6px}
.linkrow .inp{direction:ltr;text-align:left}
.sectitle{font-weight:800;font-size:14px;margin:22px 2px 6px;display:flex;align-items:center;gap:6px}
.toast{position:fixed;top:calc(14px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;z-index:90;font-weight:700;font-size:14px;box-shadow:var(--shadow);max-width:90vw}

/* login */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(160deg,var(--beige-l),var(--beige))}
.login .box{width:100%;max-width:380px;text-align:center}
.login h1{font-family:Montserrat;letter-spacing:.25em;font-size:24px;margin:0;color:var(--brown-d)}
.login .people{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:22px}
.login .person{padding:14px 6px;border:1px solid var(--line);border-radius:14px;background:#fff;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:700;font-size:13px}
@media(min-width:900px){main{padding-left:24px;padding-right:24px}.fab{left:32px}}
</style>
</head>

<script>
'use strict';
/* ───────── CONFIG ───────── */
const SB_URL = 'https://ltwzmjqrlvqbndmipufm.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx0d3ptanFybHZxYm5kbWlwdWZtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcxMDA3NTEsImV4cCI6MjA5MjY3Njc1MX0.pvp5NFr2tOTw_MJHIxHO9kK7cQ75QjL5N8AcewXIVOM';
const BUCKET = 'task-attachments';

const AUTH_KEY = 'muhra-team-auth';                 // shared login session for HQ + Tasks app

const LINKS = {

const sb = supabase.createClient(SB_URL, SB_KEY, { auth: { storageKey: AUTH_KEY, persistSession: true, autoRefreshToken: true, detectSessionInUrl: false } });

const STAGES = [
  { k: 'idea', n: 'فكرة', ic: '💡', bg: '#F1ECE6', fg: '#6B5A4D' },
  { k: 'script', n: 'سكريبت', ic: '✍️', bg: '#EDE7F3', fg: '#5B4A7A' },

  { k: 'review', n: 'مراجعة', ic: '👀', bg: '#FBF0DC', fg: '#A26A10' },
  { k: 'approved', n: 'معتمد', ic: '✅', bg: '#E5F0E8', fg: '#3F7A57' },
  { k: 'scheduled', n: 'مجدول', ic: '🗓️', bg: '#E3EEF0', fg: '#2F6970' },
  { k: 'posted', n: 'منشور', ic: '📣', bg: '#E9E4DE', fg: '#5C3D2E' }
];
const SI = Object.fromEntries(STAGES.map((s, i) => [s.k, i]));
const SM = Object.fromEntries(STAGES.map(s => [s.k, s]));
const TYPES = { reel: 'ريل', carousel: 'كاروسيل', post: 'بوست', story: 'ستوري', tiktok: 'تيك توك', ad: 'إعلان' };
const TYPE_IC = { reel: '🎬', carousel: '🖼️', post: '📷', story: '⭕', tiktok: '🎵', ad: '📢' };
const PLATFORMS = { instagram: 'إنستجرام', tiktok: 'تيك توك', facebook: 'فيسبوك' };
const PILLARS = ['إطلاق منتج', 'تنسيقات', 'كواليس', 'آراء عملاء / UGC', 'عروض', 'تعليمي / مقاسات', 'براند'];
const DONE_STAGES = ['approved', 'scheduled', 'posted'];
const AR_DAYS = ['الأحد', 'الإثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];

/* ───────── STATE ───────── */
const S = {
  me: null, team: [], teamMap: {}, photos: {},
  items: [], tab: 'home', board: { stage: 'idea', mine: false, type: '' },
  calStart: null, research: { days: 14, format: '', kind: 'competitor', rows: null, loading: false },
  openId: null, myTasks: [], stats: null, activity: []
};

/* ───────── HELPERS ───────── */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const lsG = (k, fb) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : fb; } catch { return fb; } };
const lsS = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
const pad = n => String(n).padStart(2, '0');
const isoDate = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const today = () => isoDate(new Date());
const addDays = (iso, n) => { const d = new Date(iso + 'T12:00:00'); d.setDate(d.getDate() + n); return isoDate(d); };
const dayDiff = iso => Math.round((new Date(iso + 'T12:00:00') - new Date(today() + 'T12:00:00')) / 864e5);
const fmtDay = iso => { const d = new Date(iso + 'T12:00:00'); return AR_DAYS[d.getDay()] + ' ' + d.getDate() + '/' + (d.getMonth() + 1); };
const fmtShort = iso => { const d = new Date(iso + 'T12:00:00'); return d.getDate() + '/' + (d.getMonth() + 1); };
const fmtTime = ts => { const d = new Date(ts); return d.getDate() + '/' + (d.getMonth() + 1) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const num = n => n == null ? '—' : n >= 1e6 ? (n / 1e6).toFixed(1) + 'M' : n >= 1e4 ? Math.round(n / 1e3) + 'K' : n >= 1e3 ? (n / 1e3).toFixed(1) + 'K' : String(n);
const safeUrl = u => { try { const x = new URL(u); return /^https?:$/.test(x.protocol) ? x.href : ''; } catch { return ''; } };
const isApprover = () => !!(S.me && S.me.can_approve);
const approverIds = () => S.team.filter(m => m.can_approve).map(m => m.id);
const approverNames = () => S.team.filter(m => m.can_approve).map(m => firstName(m.id)).join(' أو ') || 'المسؤول';
const isAdmin = () => S.me && S.me.role === 'admin';
const nameOf = id => (S.teamMap[id] && S.teamMap[id].name) || id || '—';
const firstName = id => nameOf(id).replace(/^Dr\.\s*/, '').split(' ')[0];
const weekStart = iso => { const d = new Date(iso + 'T12:00:00'); d.setDate(d.getDate() - ((d.getDay() + 1) % 7)); return isoDate(d); }; // weeks start Saturday
function toast(msg, ms = 2200) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), ms); }
function av(id, lg) {
  const m = S.teamMap[id]; if (!m) return '<span class="av' + (lg ? ' lg' : '') + '" style="background:#bbb">?</span>';
  const ph = S.photos[id];
  return '<span class="av' + (lg ? ' lg' : '') + '" title="' + esc(m.name) + '" style="background-color:' + esc(m.color || '#5C3D2E') + (ph ? ';background-image:url(\'' + esc(ph) + '\')' : '') + '">' + (ph ? '' : esc(m.initials || m.name[0])) + '</span>';
}
function stageTag(k) { const s = SM[k] || STAGES[0]; return '<span class="stage-tag" style="background:' + s.bg + ';color:' + s.fg + '">' + s.ic + ' ' + s.n + '</span>'; }
function dueInfo(it) {
  if (DONE_STAGES.includes(it.stage)) return '';
  const out = [];
  if (it.due_date) { const d = dayDiff(it.due_date); out.push('<span class="pill ' + (d < 0 ? 'late' : d <= 1 ? 'soon' : '') + '">⏱ ' + (d < 0 ? 'متأخر ' + (-d) + ' يوم' : d === 0 ? 'اليوم' : d === 1 ? 'بكرة' : fmtShort(it.due_date)) + '</span>'); }
  if (it.publish_date) { const d = dayDiff(it.publish_date); if (d <= 2) out.push('<span class="pill ' + (d < 0 ? 'late' : 'soon') + '">📅 نشر ' + (d < 0 ? 'فات' : d === 0 ? 'اليوم' : d === 1 ? 'بكرة' : fmtShort(it.publish_date)) + '</span>'); }
  return out.join('');
}
const isLate = it => !DONE_STAGES.includes(it.stage) && ((it.due_date && dayDiff(it.due_date) < 0) || (it.publish_date && dayDiff(it.publish_date) < 0));
function itemThumb(it) {
  const img = (it.files || []).find(f => /\.(jpe?g|png|webp|gif|heic)$/i.test(f.name || f.url || ''));
  const u = (img && img.url) || it.ref_thumb;
  return u ? '<div class="thumb" style="background-image:url(\'' + esc(u) + '\')"></div>' : '<div class="thumb">' + (TYPE_IC[it.type] || '📄') + '</div>';
}
function ccard(it, opts = {}) {
  return '<div class="card ccard" data-open="' + it.id + '">' + itemThumb(it) +
    '<div class="grow"><div class="t">' + esc(it.title) + '</div><div class="meta">' +
    (opts.noStage ? '' : stageTag(it.stage)) +
    '<span class="pill">' + (TYPE_IC[it.type] || '') + ' ' + (TYPES[it.type] || it.type) + '</span>' + dueInfo(it) +
    (it.changes_note && it.stage === 'edit' ? '<span class="pill late">✏️ تعديلات</span>' : '') +
    '</div>' + (opts.extra || '') + '</div>' + (it.owner ? av(it.owner) : '') + '</div>';
}

/* ───────── DATA ───────── */
async function loadTeam() {
  const [{ data: t, error }, { data: p }] = await Promise.all([
    sb.from('team_members').select('id,name,title,role,color,initials,user_id,can_approve').eq('active', true).order('created_at'),
    sb.from('profiles').select('user_id,photo_url')
  ]);
  if (error) throw error;
  S.team = t || []; S.teamMap = Object.fromEntries(S.team.map(m => [m.id, m]));
  S.photos = Object.fromEntries((p || []).filter(x => x.photo_url).map(x => [x.user_id, x.photo_url]));
}
async function loadItems() {
  const { data, error } = await sb.from('hq_content').select('*').neq('stage', 'archived').order('created_at', { ascending: false }).limit(1000);
  if (error) { toast('خطأ في تحميل المحتوى'); console.error(error); return; }
  S.items = data || [];
}
async function loadMyTasks() {
  const { data } = await sb.from('tasks').select('id,title,status,deadline,assigned_to,priority').neq('status', 'Done').limit(300);
  S.myTasks = (data || []).filter(t => Array.isArray(t.assigned_to) ? t.assigned_to.includes(S.me.id) : t.assigned_to === S.me.id);
}
async function logAct(item_id, action, from_stage, to_stage, note) {
  await sb.from('hq_activity').insert({ item_id, actor: S.me.id, action, from_stage: from_stage || null, to_stage: to_stage || null, note: note || null });
}
async function push(ids, title, body) {
  ids = [...new Set((ids || []).filter(id => id && id !== S.me.id))];
  if (!ids.length) return;
  const { error } = await sb.functions.invoke('send-push', { body: { external_ids: ids, title, body } });
  if (error) console.warn('push failed', error);
}
async function updateItem(id, patch, silent) {
  const it = S.items.find(x => x.id === id); if (it) Object.assign(it, patch);
  const { error } = await sb.from('hq_content').update(patch).eq('id', id);
  if (error) { toast('لم يتم الحفظ — حاول مرة أخرى'); console.error(error); return false; }
  if (!silent) toast('تم الحفظ ✓', 1100);
  return true;
}

/* stage changes in one place so logs + notifications are always consistent */
async function moveStage(it, to, opts = {}) {
  const from = it.stage; if (from === to && !opts.force) return;
  const patch = { stage: to };
  if (to === 'approved') { patch.approved_by = S.me.id; patch.approved_at = new Date().toISOString(); patch.changes_note = null; }
  if (opts.changes) { patch.changes_note = opts.changes; }
  if (to === 'review') patch.changes_note = null;
  if (opts.post_url !== undefined) patch.post_url = opts.post_url;
  if (!(await updateItem(it.id, patch, true))) return;
  await logAct(it.id, opts.changes ? 'changes' : 'stage', from, to, opts.changes || null);
  const team = [it.owner, ...(it.helpers || [])];
  if (to === 'review') { push(approverIds(), '👀 محتوى للمراجعة', it.title); }
  else if (to === 'approved') { push(team, '✅ تمت الموافقة', it.title); }
  else if (opts.changes) { push(team, '✏️ مطلوب تعديلات', it.title + ' — ' + opts.changes); }
  else if (to === 'posted') { push([...team, ...approverIds()], '📣 تم النشر', it.title); }
  else push(team, SM[to].ic + ' ' + SM[to].n, it.title);
  toast(opts.changes ? 'تم إرسال طلب التعديل' : SM[to].ic + ' ' + SM[to].n);
  renderAll();
}

/* ───────── LOGIN ───────── */
function loginShell(inner) {
  $('#app').innerHTML = '<div class="login"><div class="box"><h1>MUHRA</h1><div class="muted lat" style="letter-spacing:.35em;font-size:11px;margin:4px 0 22px">HQ</div>' + inner + '</div></div>';
}
function renderLogin(err) {
  loginShell('<form id="lf" class="card pad" style="text-align:right" autocomplete="on">' +
    '<label class="lb" style="margin-top:0">اسم المستخدم</label><input class="inp lat" id="lu" name="username" autocomplete="username" dir="ltr" autocapitalize="none" spellcheck="false" required>' +
    '<label class="lb">كلمة المرور</label><input class="inp lat" id="lp" name="password" type="password" autocomplete="current-password" dir="ltr" required>' +
    (err ? '<div class="alert bad">' + esc(err) + '</div>' : '') +
    '<button class="btn pri" id="lb" style="width:100%;margin-top:16px">دخول</button>' +
    '<div class="muted small" style="margin-top:12px;text-align:center">نسيت كلمة المرور؟ اطلب من المدير إعادة تعيينها.</div></form>');
  $('#lu').focus();
  $('#lf').onsubmit = async e => {
    e.preventDefault();
    const u = $('#lu').value.trim().toLowerCase(), pw = $('#lp').value;
    if (!u || !pw) return;
    $('#lb').disabled = true; $('#lb').textContent = '...';
    const email = u.includes('@') ? u : u + '@' + LOGIN_DOMAIN;
    const { error } = await sb.auth.signInWithPassword({ email, password: pw });
    if (error) return renderLogin(/rate|many/i.test(error.message) ? 'محاولات كثيرة، استنى دقيقة وجرب تاني' : 'اسم المستخدم أو كلمة المرور غير صحيحة');
    afterSignIn();
  };
}
function renderChangePassword(forced, err) {
  loginShell('<form id="cf" class="card pad" style="text-align:right">' +
    '<div style="font-weight:800;margin-bottom:4px">' + (forced ? 'اختار كلمة مرور جديدة' : 'تغيير كلمة المرور') + '</div>' +
    '<div class="muted small">' + (forced ? 'دي أول مرة تدخل — غيّر كلمة المرور المؤقتة.' : '') + ' 8 حروف على الأقل.</div>' +
    '<label class="lb">كلمة المرور الجديدة</label><input class="inp lat" id="np1" type="password" autocomplete="new-password" dir="ltr" minlength="8" required>' +
    '<label class="lb">تأكيد كلمة المرور</label><input class="inp lat" id="np2" type="password" autocomplete="new-password" dir="ltr" minlength="8" required>' +
    (err ? '<div class="alert bad">' + esc(err) + '</div>' : '') +
    '<button class="btn pri" id="cb" style="width:100%;margin-top:16px">حفظ</button>' +
    (forced ? '' : '<button type="button" class="btn ghost" id="cc" style="width:100%;margin-top:6px">إلغاء</button>') + '</form>');
  $('#np1').focus();
  if (!forced) $('#cc').onclick = () => boot2();
  $('#cf').onsubmit = async e => {
    e.preventDefault();
    const a = $('#np1').value, b = $('#np2').value;
    if (a.length < 8) return renderChangePassword(forced, 'كلمة المرور لازم 8 حروف على الأقل');
    if (a !== b) return renderChangePassword(forced, 'كلمتين المرور مش متطابقين');
    $('#cb').disabled = true;
    const { error } = await sb.auth.updateUser({ password: a, data: { must_change_password: false } });
    if (error) return renderChangePassword(forced, /same|different/i.test(error.message) ? 'اختار كلمة مرور مختلفة عن القديمة' : 'تعذر الحفظ، حاول تاني');
    toast('تم تغيير كلمة المرور ✓');
    afterSignIn();
  };
}
async function afterSignIn() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return renderLogin();
  try { await loadTeam(); } catch (e) { return renderLogin('تعذر الاتصال، حاول تاني'); }
  const me = S.team.find(m => m.user_id === session.user.id);
  if (!me) { await sb.auth.signOut(); localStorage.removeItem(UID_KEY); return renderLogin('الحساب ده مش عضو في الفريق'); }
  if (session.user.user_metadata && session.user.user_metadata.must_change_password) return renderChangePassword(true);
  S.me = me; lsS(UID_KEY, me.id);
  boot2();
}
async function signOut() { await sb.auth.signOut(); localStorage.removeItem(UID_KEY); location.replace(location.pathname); }

/* ───────── VIEW: TODAY ───────── */
function viewHome(v) {
  const me = S.me.id, h = new Date().getHours();
  const mine = S.items.filter(i => (i.owner === me || (i.helpers || []).includes(me)) && !['review', ...DONE_STAGES].includes(i.stage))
    .sort((a, b) => (a.due_date || a.publish_date || '9999').localeCompare(b.due_date || b.publish_date || '9999'));
  const changes = mine.filter(i => i.changes_note);
  const rest = mine.filter(i => !i.changes_note);
  const review = S.items.filter(i => i.stage === 'review');
  const waitingMine = S.items.filter(i => i.stage === 'review' && i.owner === me);
  const shown = new Set([...mine, ...(isApprover() ? review : []), ...waitingMine].map(i => i.id));
  const notReady = S.items.filter(i => !shown.has(i.id) && i.publish_date && dayDiff(i.publish_date) >= 0 && dayDiff(i.publish_date) <= 2 && !DONE_STAGES.includes(i.stage));
  let html = '<div style="margin:4px 2px 12px"><div style="font-size:21px;font-weight:800">' + (h < 12 ? 'صباح الخير' : 'مساء الخير') + ' ' + esc(firstName(me)) + ' 👋</div>' +
    '<div class="muted small">' + fmtDay(today()) + ' · ' + (mine.length ? 'عندك ' + mine.length + ' شغل مفتوح' : 'مفيش شغل متأخر عليك') + '</div></div>';
  html += weekStrip();
  if (isApprover()) {
    html += '<h2 class="sec">👀 بانتظار موافقتك <span class="n">' + review.length + '</span></h2>';
    html += review.length ? '<div class="list">' + review.map(i => ccard(i, { noStage: true, extra: '<div class="row" style="margin-top:8px"><button class="btn ok sm" data-approve="' + i.id + '">✅ موافقة</button><button class="btn bad sm" data-changes="' + i.id + '">✏️ تعديل</button><span class="muted small">' + esc(firstName(i.owner)) + '</span></div>' })).join('') + '</div>' : '<div class="empty">مفيش حاجة مستنية موافقتك ✨</div>';
  }
  if (changes.length) html += '<h2 class="sec">✏️ تعديلات مطلوبة منك <span class="n">' + changes.length + '</span></h2><div class="list">' + changes.map(i => ccard(i, { extra: '<div class="alert warn" style="margin-top:7px;padding:7px 10px">' + esc(i.changes_note) + '</div>' })).join('') + '</div>';
  html += '<h2 class="sec">📌 مطلوب منك <span class="n">' + rest.length + '</span></h2>';
  html += rest.length ? '<div class="list">' + rest.map(i => ccard(i)).join('') + '</div>' : '<div class="empty">مفيش محتوى عليك دلوقتي. خد فكرة من <b>الأبحاث</b> أو اضغط <b>+</b></div>';
  if (waitingMine.length) html += '<h2 class="sec">⏳ مستني الموافقة <span class="n">' + waitingMine.length + '</span></h2><div class="list">' + waitingMine.map(i => ccard(i)).join('') + '</div>';
  if (notReady.length) html += '<h2 class="sec">⏰ نشره خلال يومين ولسه مش جاهز <span class="n">' + notReady.length + '</span></h2><div class="list">' + notReady.map(i => ccard(i)).join('') + '</div>';
  if (S.myTasks.length) html += '<h2 class="sec">🗂 مهام أخرى (تطبيق المهام) <span class="n">' + S.myTasks.length + '</span></h2><div class="card">' + S.myTasks.slice(0, 6).map(t => '<a href="' + LINKS.tasks + '" style="display:flex;gap:8px;align-items:center;padding:11px 14px;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink)"><span class="grow">' + esc(t.title) + '</span>' + (t.deadline && new Date(t.deadline) < new Date() ? '<span class="pill late">متأخر</span>' : '') + '<span class="pill">' + esc(t.status) + '</span></a>').join('') + '</div>';
  v.innerHTML = html;
  bindWeekStrip(v);
  v.querySelectorAll('[data-approve]').forEach(b => b.onclick = () => { const it = S.items.find(x => x.id === b.dataset.approve); if (it) moveStage(it, 'approved'); });
  v.querySelectorAll('[data-changes]').forEach(b => b.onclick = () => askChanges(S.items.find(x => x.id === b.dataset.changes)));
}
function weekStrip() {
  const t = today(); let cells = '';
  for (let d = 0; d < 7; d++) {
    const k = addDays(t, d), n = S.items.filter(i => i.publish_date === k).length, dt = new Date(k + 'T12:00:00');
    cells += '<div class="wd ' + (n ? '' : 'gap ') + (d === 0 ? 'today' : '') + '" data-day="' + k + '"><div class="d">' + AR_DAYS[dt.getDay()].replace('ال', '') + '</div><div class="n">' + dt.getDate() + '</div><div class="c">' + (n ? n + ' منشور' : 'فاضي') + '</div></div>';
  }
  return '<div class="week">' + cells + '</div>';
}
function bindWeekStrip(v) { v.querySelectorAll('[data-day]').forEach(el => el.onclick = () => { S.calStart = weekStart(el.dataset.day); S.tab = 'cal'; renderAll(); setTimeout(() => { const t = document.getElementById('day-' + el.dataset.day); if (t) t.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 50); }); }

/* ───────── VIEW: BOARD ───────── */
function viewBoard(v) {
  const f = S.board;
  const pool = S.items.filter(i => (!f.mine || i.owner === S.me.id || (i.helpers || []).includes(S.me.id)) && (!f.type || i.type === f.type));
  const wide = window.innerWidth >= 1000;
  let html = '<div class="toolbar"><button class="chip ' + (f.mine ? '' : 'on') + '" data-mine="0">الكل</button><button class="chip ' + (f.mine ? 'on' : '') + '" data-mine="1">شغلي</button>' +
    '<select class="mini" id="typeF"><option value="">كل الأنواع</option>' + Object.entries(TYPES).map(([k, n]) => '<option value="' + k + '"' + (f.type === k ? ' selected' : '') + '>' + n + '</option>').join('') + '</select>' +
    '<span class="muted small" style="margin-inline-start:auto">' + pool.filter(i => !DONE_STAGES.includes(i.stage)).length + ' شغال · ' + pool.filter(isLate).length + ' متأخر</span></div>';
  if (wide) {
    html += '<div class="kanban">' + STAGES.map(s => {
      const col = sortCol(pool.filter(i => i.stage === s.k), s.k);
      return '<div class="kcol"><h3><span>' + s.ic + ' ' + s.n + '</span><span class="muted lat">' + col.length + '</span></h3><div class="list">' + (col.map(i => ccard(i, { noStage: true })).join('') || '<div class="muted small" style="padding:8px">—</div>') + '</div></div>';
    }).join('') + '</div>';
  } else {
    html += '<div class="chips">' + STAGES.map(s => '<button class="chip ' + (f.stage === s.k ? 'on' : '') + '" data-stage="' + s.k + '">' + s.ic + ' ' + s.n + ' <span class="c">' + pool.filter(i => i.stage === s.k).length + '</span></button>').join('') + '</div>';
    const col = sortCol(pool.filter(i => i.stage === f.stage), f.stage);
    html += col.length ? '<div class="list">' + col.map(i => ccard(i, { noStage: true })).join('') + '</div>' : '<div class="empty">مفيش محتوى في مرحلة «' + SM[f.stage].n + '»</div>';
  }
  v.innerHTML = html;
  v.querySelectorAll('[data-mine]').forEach(b => b.onclick = () => { f.mine = b.dataset.mine === '1'; renderAll(); });
  v.querySelectorAll('[data-stage]').forEach(b => b.onclick = () => { f.stage = b.dataset.stage; renderAll(); });
  $('#typeF').onchange = e => { f.type = e.target.value; renderAll(); };
}
function sortCol(arr, stage) {
  if (stage === 'posted') return arr.sort((a, b) => (b.posted_at || '').localeCompare(a.posted_at || '')).slice(0, 40);
  return arr.sort((a, b) => (a.publish_date || a.due_date || '9999').localeCompare(b.publish_date || b.due_date || '9999'));
}

/* ───────── VIEW: CALENDAR ───────── */
function viewCal(v) {
  if (!S.calStart) S.calStart = weekStart(today());
  const st = S.calStart, end = addDays(st, 6);
  let html = '<div class="toolbar"><button class="btn sm" id="prevW">→ السابق</button><b class="grow" style="text-align:center">' + fmtShort(st) + ' – ' + fmtShort(end) + '</b><button class="btn sm" id="nextW">التالي ←</button></div>';

async function uploadFiles(it, files) {
  if (!files.length) return;
  const big = files.find(f => f.size > 50 * 1024 * 1024);
  if (big) return toast('الملف «' + big.name + '» أكبر من 50MB — اضغطه أو حط رابط Drive', 4000);
  toast('جاري الرفع…', 1500);
  const out = [...(it.files || [])];
  for (const f of files) {
    const clean = f.name.replace(/[^\w.\-]+/g, '_').slice(-60);
    const path = 'hq/' + it.id + '/' + Date.now() + '_' + clean;
    const { error } = await sb.storage.from(BUCKET).upload(path, f, { contentType: f.type || undefined, upsert: false });
    if (error) { toast('فشل رفع ' + f.name); console.error(error); continue; }
    const { data } = sb.storage.from(BUCKET).getPublicUrl(path);
    out.push({ name: f.name, url: data.publicUrl, by: S.me.id, at: new Date().toISOString() });
  }
  await updateItem(it.id, { files: out }, true); logAct(it.id, 'files', null, null, files.length + ' ملف');
  toast('تم الرفع ✓'); renderSheet(it); loadThread(it.id); renderAllBg();
}

async function sendToReview(it) {

  if (SI[it.stage] >= SI.edit && !hasMedia && !confirm('مفيش ملف أو رابط Drive مرفق. ترسل للمراجعة برضه؟')) return;

function askChanges(it, inSheet) {

  const back = SI[it.stage] <= SI.script ? 'script' : 'edit';
  moveStage(it, back, { changes: note.trim(), force: true }).then(() => {
    sb.from('hq_comments').insert({ item_id: it.id, author: S.me.id, text: '✏️ تعديلات: ' + note.trim() });

function genPassword() {

  return 'Muhra-' + pick(0, 6) + '-' + pick(6, 4);
}

  $('#mSave').onclick = async () => {
    const b = $('#mSave'); b.disabled = true;
    const payload = { name: $('#mName').value.trim(), title: $('#mTitle').value.trim(), role: $('#mRole').value, color: $('#mColor').value, can_approve: $('#mAppr').classList.contains('on') };
    try {
      if (m) { await teamAdmin({ action: 'update', id: m.id, ...payload }); await loadTeam(); if (m.id === S.me.id) S.me = S.teamMap[m.id] || S.me; renderShell(); renderAll(); openTeam('<div class="alert ok">تم حفظ بيانات ' + esc(payload.name) + ' ✓</div>'); }
      else {
        const username = $('#mUser').value.trim().toLowerCase(), password = $('#mPw').value.trim();
        await teamAdmin({ action: 'create', username, password, ...payload });
        await loadTeam(); renderAll();
        openTeam('<div class="alert ok" style="margin-top:12px">تم إنشاء حساب ' + esc(payload.name) + ' ✓</div>' + credCard(username, password));
      }
    } catch (e) { b.disabled = false; msg(esc(e.message)); }
  };
  if (m) {
    $('#mPhoto').onclick = () => pickPhoto(m.id);
    $('#mReset').onclick = async () => {
      if (!confirm('إعادة تعيين كلمة مرور ' + m.name + '؟ القديمة هتتوقف.')) return;
      const np = genPassword(); $('#mReset').disabled = true;
      try { await teamAdmin({ action: 'reset_password', id: m.id, password: np }); $('#resetOut').innerHTML = credCard(m.id, np); bindCopy($('#resetOut')); }
      catch (e) { $('#resetOut').innerHTML = '<div class="alert bad">' + esc(e.message) + '</div>'; }
      $('#mReset').disabled = false;
    };
    const del = $('#mDel');
    if (del) {
      $('#mConfirm').oninput = () => { del.disabled = $('#mConfirm').value.trim().toLowerCase() !== m.id; };
      del.onclick = async () => {
        del.disabled = true; del.textContent = '...';
        try {
          const r = await teamAdmin({ action: 'delete', id: m.id, transfer_to: $('#mTo').value || null });
          await Promise.all([loadTeam(), loadItems()]); renderAll();
          const mv = r && r.moved ? ' — اتنقل ' + (r.moved.content || 0) + ' محتوى و' + (r.moved.tasks || 0) + ' مهمة' : '';
          openTeam('<div class="alert ok" style="margin-top:12px">تم حذف ' + esc(m.name) + ' نهائيًا' + mv + '</div>');
        } catch (e) { del.disabled = false; del.textContent = 'حذف نهائي'; msg(esc(e.message)); }
      };
    }
  }
}

/* ───────── REALTIME ───────── */
let rtTimer = null;
function subscribe() {
  if (S._sub) return; S._sub = true;
  sb.channel('hq-live')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'hq_content' }, () => { clearTimeout(rtTimer); rtTimer = setTimeout(async () => { await loadItems(); renderAll(); }, 600); })
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'hq_comments' }, p => { if (p.new && p.new.item_id === S.openId) loadThread(S.openId); })
    .subscribe();
  document.addEventListener('visibilitychange', async () => { if (!document.hidden && S.me) { await loadItems(); renderAll(); } });
}

/* ───────── BOOT ───────── */
async function boot() {
  loginShell('<p class="muted">جاري التحميل…</p>');
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return renderLogin();
  afterSignIn();
}
sb.auth.onAuthStateChange(ev => { if (ev === 'SIGNED_OUT' && S.me) { S.me = null; localStorage.removeItem(UID_KEY); renderLogin('انتهت الجلسة، سجل الدخول تاني'); } });
async function boot2() {
  renderShell();
  $('#view').innerHTML = '<div class="empty">جاري التحميل…</div>';
  await Promise.all([loadItems(), loadMyTasks()]);
  renderAll(); subscribe();
  const m = location.hash.match(/item=([0-9a-f-]{36})/); if (m) openItem(m[1]); else if (location.hash === '#team') openTeam();
  if (S._listeners) return; S._listeners = true;
  window.addEventListener('hashchange', () => { const mm = location.hash.match(/item=([0-9a-f-]{36})/); if (mm && mm[1] !== S.openId) openItem(mm[1]); else if (location.hash === '#team') openTeam(); });
  let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if (S.tab === 'board') renderAll(); }, 250); });
}
boot();
</script>
