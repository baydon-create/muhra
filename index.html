<script>
  window.OneSignalDeferred = window.OneSignalDeferred || [];OneSignalDeferred.push(async function(OneSignal) {
await OneSignal.init({
appId: "397aeb96-2c45-4cd8-9a5e-da6c2625281b",
serviceWorkerPath: "/muhra/OneSignalSDKWorker.js",
serviceWorkerParam: { scope: "/muhra/" },

allowLocalhostAsSecureOrigin: true,
});
console.log("OneSignal initialized successfully");

// Called after login - sets external user ID in OneSignal
// This links the device to the user without needing token management
window.registerUserWithOneSignal = async function(userId) {
try {
if (typeof OneSignal === "undefined") {
console.log("OneSignal not ready, retrying...");
setTimeout(() => window.registerUserWithOneSignal(userId), 2000);
return;
}

  const cleanId = userId.replace(/[^a-zA-Z0-9_-]/g, "");
  console.log("OneSignal.login with cleanId:", cleanId);

  // 1. Log the user in
  await OneSignal.login(cleanId);

  // 2. CRITICAL: Add the tag for the backend filter
  await OneSignal.User.addTag("external_id", cleanId);
  console.log("Registered and tagged with:", cleanId);

  // Request permission
  if (Notification.permission === "default") {
    const perm = await Notification.requestPermission();
    console.log("Notification permission:", perm);
  }

  if (Notification.permission === "granted") {
    await OneSignal.User.PushSubscription.optIn();
    console.log("Opted in to push");
  }

  // Now save the subscription ID to Supabase
  await saveSubscriptionToSupabase(cleanId);
} catch(e) {
  console.log("registerUserWithOneSignal error:", e);
}
};
window.saveSubscriptionToSupabase = async function(userId) {
try {
const SUPA_URL = "https://ltwzmjqrlvqbndmipufm.supabase.co";
const SUPA_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx0d3ptanFybHZxYm5kbWlwdWZtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcxMDA3NTEsImV4cCI6MjA5MjY3Njc1MX0.pvp5NFr2tOTw_MJHIxHO9kK7cQ75QjL5N8AcewXIVOM";

  // Get the OneSignal subscription ID (more reliable than token)
  let subId = null;
  let attempts = 0;

  while (!subId && attempts < 15) {
    attempts++;
    subId = OneSignal.User?.PushSubscription?.id;
    const token = OneSignal.User?.PushSubscription?.token;
    console.log(`Attempt ${attempts}: subId=${subId}, token=${token ? token.slice(0,15)+"..." : "none"}`);
    if (!subId && !token) {
      await new Promise(r => setTimeout(r, 2000));
    } else {
      subId = subId || token;
      break;
    }
  }

  if (!subId) {
    console.log("Could not get subscription ID after", attempts, "attempts");
    return;
  }

  console.log("Saving to Supabase - userId:", userId, "subId:", subId.slice(0,20)+"...");

  const res = await fetch(SUPA_URL + "/rest/v1/push_tokens", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "apikey": SUPA_ANON,
      "Authorization": "Bearer " + SUPA_ANON,
      "Prefer": "resolution=merge-duplicates"
    },
    body: JSON.stringify({
      user_id: userId,
      token: subId,
      updated_at: new Date().toISOString()
    })
  });

  const responseText = await res.text();
  console.log("Supabase save result:", res.status, responseText);

  if (res.ok || res.status === 201 || res.status === 200) {
    console.log("Token saved successfully for", userId);
  }
} catch(e) {
  console.log("saveSubscriptionToSupabase error:", e);
}
};

// Updated SmartText to automatically render uploaded images inline
function SmartText({text,style={}}){
  if(!text)return null;
  const isImg=s=>/\.(jpeg|jpg|gif|png|webp|bmp)(\?.*)?$/i.test(s);
  const parts=text.split(/(https?:\/\/[^\s]+)/);
  const hasArabic=isArabic(text);
  return <span style={{wordBreak:"break-word",overflowWrap:"anywhere",whiteSpace:"pre-wrap",...style,...(hasArabic?arabicStyle:{})}}>
    {parts.map((part,i)=>

async function startRecording(){
try{
const stream=await navigator.mediaDevices.getUserMedia({audio:true});
chunksRef.current=[];
const mr=new MediaRecorder(stream,{mimeType:MediaRecorder.isTypeSupported("audio/webm")?"audio/webm":"audio/mp4"});
mr.ondataavailable=ev=>{if(ev.data.size>0)chunksRef.current.push(ev.data);};
mr.onstop=async()=>{
stream.getTracks().forEach(t=>t.stop());
const blob=new Blob(chunksRef.current,{type:mr.mimeType});
await uploadVoice(blob,mr.mimeType);
};
mr.start();
mediaRecRef.current=mr;
setRecording(true);
setRecSeconds(0);
recTimerRef.current=setInterval(()=>setRecSeconds(s=>s+1),1000);
}catch(err){alert("Microphone access denied. Please allow microphone access and try again.");}
}
function stopRecording(){
if(mediaRecRef.current&&recording){
mediaRecRef.current.stop();
clearInterval(recTimerRef.current);
setRecording(false);
setUploadingVoice(true);
}

async function handleAttach(e){
const files=Array.from(e.target.files).filter(f=>f.type.startsWith("image/"));
if(!files.length)return;
const valid=files.filter(f=>f.size<=10*1024*1024);
if(files.length>valid.length)alert(`${files.length-valid.length} file(s) over 10MB skipped`);
if(!valid.length)return;
setUploading(true);
const newItems=[];
for(const file of valid){
try{
const ext=file.name.split(".").pop();
const path=`${task.id}/${Date.now().toString(36)}_${Math.random().toString(36).slice(2)}.${ext}`;
const {error}=await sb.storage.from("task-attachments").upload(path,file,{cacheControl:"3600",upsert:false});
if(error){alert("Upload failed: "+error.message);continue;}
const {data:{publicUrl}}=sb.storage.from("task-attachments").getPublicUrl(path);
newItems.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2),url:publicUrl,path,name:file.name,uploadedBy:userId,uploadedAt:new Date().toISOString(),note:""});
}catch(err){alert("Error: "+err.message);}

e.target.value="";

    {editMode&&isAdmin?<div style={{display:"flex",flexDirection:"column",gap:12}}>
      <FL>Title</FL><input className="inp" value={ef.title} onChange={ev=>setEf(f=>({...f,title:ev.target.value}))}/>
      <FL>Description</FL><textarea className="inp" style={{minHeight:80}} value={ef.description} onChange={ev=>setEf(f=>({...f,description:ev.target.value}))}/>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
        <div><FL>Priority</FL><select className="inp" value={ef.priority} onChange={ev=>setEf(f=>({...f,priority:ev.target.value}))}>{PRIO.map(p=><option key={p}>{p}</option>)}</select></div>
        <div><FL>Deadline</FL><input type="date" className="inp" value={ef.deadline} onChange={ev=>setEf(f=>({...f,deadline:ev.target.value}))}/></div>
      </div>
      <FL>Assign To</FL>
      <div style={{display:"flex",flexDirection:"column",gap:6}}>
        {TEAM.map(m=>{
          const cur=Array.isArray(ef.assigned_to)?ef.assigned_to:[ef.assigned_to].filter(Boolean);
          const sel=cur.includes(m.id);
          return <div key={m.id} onClick={()=>setEf(f=>{const c2=Array.isArray(f.assigned_to)?f.assigned_to:[f.assigned_to].filter(Boolean);return {...f,assigned_to:c2.includes(m.id)?c2.filter(x=>x!==m.id):[...c2,m.id]};})}
            style={{display:"flex",alignItems:"center",gap:10,padding:"10px 12px",borderRadius:10,border:`1.5px solid ${sel?"var(--gold)":"var(--border)"}`,background:sel?"var(--gdim)":"var(--elevated)",cursor:"pointer",minHeight:48}}>
            <Av member={m} photo={profiles[m.id]} size={28}/>
            <div style={{flex:1,fontSize:13,fontWeight:600,color:"var(--t1)"}}>{m.name}</div>
            <div style={{width:18,height:18,borderRadius:5,border:`2px solid ${sel?"var(--gold)":"var(--bmd)"}`,background:sel?"var(--gold)":"transparent",display:"flex",alignItems:"center",justifyContent:"center",color:"var(--sidebar)"}}>
              {sel&&Ic.check2}
            </div>
          </div>;})}
      </div>
      <div style={{display:"flex",gap:8}}>
        <button className="btn" style={btnPrimary} onClick={async()=>{await onEdit(ef);setEditMode(false);}}>Save</button>
        <button className="btn" style={btnSec} onClick={()=>setEditMode(false)}>Cancel</button>
      </div>
    </div>:

    /* ── VIEW MODE ── */
    <div style={{display:"flex",flexDirection:"column",gap:16}}>
      <div style={{display:"flex",gap:10,alignItems:"flex-start"}}>
        <div style={{flex:1,minWidth:0}}>
          <h2 style={{fontSize:21,fontWeight:800,color:"var(--t1)",margin:0,lineHeight:1.25}}><SmartText text={task.title}/></h2>
          <div style={{fontSize:12,color:"var(--t3)",marginTop:6}}>By {cr?.name} · {fD(task.created_at)}</div>
        </div>
        <span style={{display:"inline-flex",alignItems:"center",gap:5,fontSize:11,fontWeight:700,padding:"4px 10px",borderRadius:20,background:pm.bg,color:pm.text,border:`1px solid ${pm.border}`,flexShrink:0}}>
          <span style={{width:5,height:5,borderRadius:"50%",background:pm.dot}}/>{task.priority}
        </span>
      </div>

      {task.description&&<FS label="Description"><p style={{fontSize:14,color:"var(--t1)",lineHeight:1.65,margin:0,wordBreak:"break-word"}}><SmartText text={task.description}/></p></FS>}

      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
        <FS label={`Assigned (${assignees.length})`}>
          <div style={{display:"flex",flexDirection:"column",gap:8}}>
            {assignees.map(a=><div key={a.id} style={{display:"flex",alignItems:"center",gap:8}}>
              <Av member={a} photo={profiles[a.id]} size={28}/>
              <div><div style={{fontSize:13,fontWeight:600,color:"var(--t1)"}}>{a.name}</div><div style={{fontSize:11,color:"var(--t3)"}}>{a.title}</div></div>
            </div>)}
          </div>
        </FS>
        <FS label="Deadline"><div style={{fontSize:15,fontWeight:700,color:od?"#f87171":"var(--t1)",display:"flex",alignItems:"center",gap:6}}>{od&&Ic.warn}{fD(task.deadline)}</div></FS>
      </div>

      <FS label="Status">
        <div style={{display:"flex",flexWrap:"wrap",gap:7}}>
          {STAT.map(s=>{const ssm=SM[s];const active=task.status===s;
            return <button key={s} disabled={!canStatus} className="btn"
              style={{padding:"8px 14px",borderRadius:20,fontSize:12,fontWeight:active?700:500,cursor:canStatus?"pointer":"default",border:`1.5px solid ${active?ssm.text:"var(--border)"}`,background:active?ssm.bg:"transparent",color:active?ssm.text:"var(--t2)",minHeight:36}}
              onClick={()=>canStatus&&onStatusChange(s)}>{s}</button>;})}
        </div>
      </FS>

      {task.signed_by?.length>0&&<FS label="Signed By">
        <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
          {task.signed_by.map(uid=>{const m=TEAM.find(t=>t.id===uid);return m?<Av key={uid} member={m} photo={profiles[uid]} size={30} title={m.name}/>:null})}
        </div>
      </FS>}
      {canSign&&<button className="btn" style={{...btnPrimary,display:"flex",alignItems:"center",gap:8,justifyContent:"center"}} onClick={onSign}>{Ic.check2} Sign & Approve Task</button>}
      {sig&&<div style={{fontSize:13,color:"#4ade80",fontWeight:700,display:"flex",alignItems:"center",gap:6}}>{Ic.check2} You signed this task</div>}

      {!isAdmin&&<div>
        <button className="btn" style={{...btnSec,display:"flex",alignItems:"center",gap:6}} onClick={()=>setShowReq(!showReq)}>{Ic.edit} Request Edit</button>
        {showReq&&<div style={{display:"flex",flexDirection:"column",gap:8,marginTop:8}}>
          <textarea placeholder="Describe what needs to change…" value={note} onChange={ev=>setNote(ev.target.value)} className="inp" style={{minHeight:70}}/>
          <button className="btn" style={btnPrimary} onClick={async()=>{await onEditReq(note);setNote("");setShowReq(false);}}>Send Request</button>
        </div>}
      </div>}

      {isAdmin&&task.edit_requests?.length>0&&<FS label={`Edit Requests (${task.edit_requests.length})`}>
        {task.edit_requests.map(r=>{const au=TEAM.find(m=>m.id===r.author);
          return <div key={r.id} style={{background:"rgba(251,191,36,0.06)",border:"1px solid rgba(251,191,36,0.2)",borderRadius:10,padding:"10px 12px",marginBottom:6}}>
            <div style={{fontSize:11,color:"var(--t3)",marginBottom:4}}>{au?.name} · {fD(r.created_at)}</div>
            <div style={{fontSize:13,color:"var(--t1)"}}>{r.note}</div>
          </div>;})}
      </FS>}

      {/* ── INSTRUCTIONS ── */}
      <FS label="Instructions">
        <textarea
          placeholder="Add text instructions for this task…"
          value={instrText}
          onChange={ev=>setInstrText(ev.target.value)}
          className="inp"
          style={{minHeight:80}}
        />
        {instrText!==( task.instructions?.text||"")&&<button className="btn"
          style={{...btnPrimary,padding:"9px 16px",fontSize:13,alignSelf:"flex-start"}}
          onClick={saveInstructions}>{instrSaving?"Saving…":"Save Instructions"}</button>}

        {/* Voice notes */}
        <div style={{display:"flex",flexDirection:"column",gap:8}}>
          {(task.instructions?.voices||[]).map(v=>{
            const uploader=TEAM.find(m=>m.id===v.uploadedBy);
            return <div key={v.id} style={{background:"var(--elevated)",border:"1px solid var(--border)",borderRadius:12,padding:"10px 14px",display:"flex",flexDirection:"column",gap:8}}>
              <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
                <div style={{display:"flex",alignItems:"center",gap:10}}>
                  <div style={{width:34,height:34,borderRadius:"50%",background:"var(--gdim)",display:"flex",alignItems:"center",justifyContent:"center",color:"var(--gold)",flexShrink:0}}>
                    {Ic.mic}
                  </div>
                  <div>
                    <div style={{fontSize:12,fontWeight:700,color:"var(--t1)"}}>Voice Note</div>
                    <div style={{fontSize:10,color:"var(--t3)"}}>{uploader?.name?.split(" ")[0]} · {fD(v.uploadedAt)}{v.duration?` · ${fmtSec(v.duration)}`:""}</div>
                  </div>
                </div>
                {(isAdmin||v.uploadedBy===userId)&&<button className="btn" onClick={()=>deleteVoice(v.id)}
                  style={{background:"none",border:"none",color:"var(--t3)",cursor:"pointer",padding:6,display:"flex",minHeight:32,minWidth:32,alignItems:"center",justifyContent:"center"}}>{Ic.trash}</button>}
              </div>
              <audio controls src={v.url} style={{width:"100%",height:34,filter:"invert(0.85) hue-rotate(180deg)"}}/>
            </div>;})}
        </div>

        {/* Record button */}
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          {!recording?
            <button className="btn"
              style={{background:uploadingVoice?"var(--elevated)":"var(--gold)",color:uploadingVoice?"var(--t2)":"var(--sidebar)",border:"none",borderRadius:12,padding:"10px 18px",fontSize:13,fontWeight:700,display:"flex",alignItems:"center",gap:8,cursor:uploadingVoice?"default":"pointer",minHeight:44}}
              onClick={startRecording} disabled={uploadingVoice}>
              {uploadingVoice?<>Saving voice note…</>:<>{Ic.mic} Record Voice Note</>}
            </button>
          :
            <button className="btn"
              style={{background:"#dc2626",color:"#fff",border:"none",borderRadius:12,padding:"10px 18px",fontSize:13,fontWeight:700,display:"flex",alignItems:"center",gap:8,cursor:"pointer",animation:"recPulse 1.4s ease infinite",minHeight:44}}
              onClick={stopRecording}>
              {Ic.stop}
              Stop · {fmtSec(recSeconds)}
            </button>
          }
        </div>
      </FS>

      {/* ── ATTACHMENTS ── */}
      <FS label={`Attachments (${task.attachments?.length||0})`}>
        {task.attachments?.length>0&&<div style={{display:"flex",flexDirection:"column",gap:10}}>
          {task.attachments.map(at=>{
            const uploader=TEAM.find(m=>m.id===at.uploadedBy);
            const canEdit=isAdmin||at.uploadedBy===userId;
            const isEditingThis=editingNote?.id===at.id;
            return <div key={at.id} style={{background:"var(--elevated)",border:"1px solid var(--border)",borderRadius:12,overflow:"hidden"}}>
              <div style={{position:"relative",cursor:"pointer"}} onClick={()=>!isEditingThis&&setLightbox(at)}>
                <img src={at.url||at.dataUrl} alt={at.name} style={{width:"100%",maxHeight:200,objectFit:"cover",display:"block"}}/>
                <div style={{position:"absolute",top:6,right:6,display:"flex",gap:4}}>
                  {canEdit&&<button onClick={ev=>{ev.stopPropagation();setEditingNote(isEditingThis?null:{id:at.id,text:at.note||""});}}
                    style={{background:"rgba(0,0,0,0.7)",color:"#fff",border:"none",borderRadius:8,padding:"6px 10px",fontSize:11,fontWeight:600,cursor:"pointer",display:"flex",alignItems:"center",gap:4,minHeight:30}}>
                    {isEditingThis?Ic.x:<>{Ic.edit} Note</>}
                  </button>}
                  {canEdit&&<button onClick={ev=>{ev.stopPropagation();removeAttach(at.id);}}
                    style={{background:"rgba(220,38,38,0.85)",color:"#fff",border:"none",borderRadius:8,padding:"6px 10px",fontSize:11,fontWeight:600,cursor:"pointer",display:"flex",alignItems:"center",minHeight:30}}>{Ic.trash}</button>}
                </div>
                {uploader&&<div style={{position:"absolute",bottom:6,left:8,background:"rgba(0,0,0,0.65)",color:"#fff",fontSize:10,padding:"3px 8px",borderRadius:20,fontWeight:600}}>{uploader.name.split(" ")[0]}</div>}
              </div>
              {!isEditingThis&&at.note&&<div style={{padding:"10px 12px",fontSize:13,color:"var(--t1)",lineHeight:1.5,borderTop:"1px solid var(--border)",background:"var(--surface)"}}>
                <span style={{fontSize:10,color:"var(--t3)",fontWeight:700,marginRight:6}}>NOTE</span><SmartText text={at.note}/>
              </div>}
              {!isEditingThis&&!at.note&&canEdit&&<div style={{padding:"8px 12px",fontSize:12,color:"var(--t3)",borderTop:"1px solid var(--border)",background:"var(--surface)",cursor:"pointer"}} onClick={()=>setEditingNote({id:at.id,text:""})}>+ Add a note…</div>}
              {isEditingThis&&<div style={{padding:10,borderTop:"1px solid var(--border)",background:"var(--surface)",display:"flex",flexDirection:"column",gap:8}}>
                <textarea placeholder="Add a note to this image…" value={editingNote.text} onChange={ev=>setEditingNote(n=>({...n,text:ev.target.value}))}
                  className="inp" style={{minHeight:70}} autoFocus/>
                <div style={{display:"flex",gap:8}}>
                  <button className="btn" style={{...btnPrimary,padding:"9px 16px",fontSize:13,flex:1}}
                    onClick={()=>saveNote(at.id,editingNote.text.trim())}>Save Note</button>
                  <button className="btn" style={{...btnSec,padding:"9px 14px",fontSize:13}}
                    onClick={()=>setEditingNote(null)}>Cancel</button>
                </div>
              </div>}
            </div>;})}
        </div>}
        <input type="file" accept="image/*" multiple ref={fileRef} style={{display:"none"}} onChange={handleAttach}/>
        <button className="btn" style={{...btnSec,padding:"10px 16px",fontSize:13,display:"flex",alignItems:"center",gap:6,alignSelf:"flex-start"}} onClick={()=>fileRef.current?.click()} disabled={uploading}>
          {uploading?"Uploading…":<>{Ic.img} Add Images</>}
        </button>
      </FS>

      {lightbox&&<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.95)",zIndex:200,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:20}} onClick={()=>setLightbox(null)}>
        <img src={lightbox.url||lightbox.dataUrl} alt={lightbox.name} style={{maxWidth:"100%",maxHeight:"75vh",borderRadius:12,objectFit:"contain"}}/>
        {lightbox.note&&<div style={{color:"var(--t1)",fontSize:14,marginTop:12,textAlign:"center",maxWidth:340,lineHeight:1.5,background:"rgba(255,255,255,0.08)",padding:"10px 16px",borderRadius:10,border:"1px solid var(--border)"}}>{lightbox.note}</div>}
        <div style={{color:"var(--t3)",fontSize:11,marginTop:8}}>Tap anywhere to close</div>
      </div>}

      {/* ── LINKS ── */}
      <FS label={`Resources & Links (${task.links?.length||0})`}>
        {task.links?.length>0&&<div style={{display:"flex",flexDirection:"column",gap:6}}>
          {task.links.map(lk=><div key={lk.id} style={{display:"flex",alignItems:"center",gap:10,background:"var(--elevated)",border:"1px solid var(--border)",borderRadius:10,padding:"10px 12px"}}>
            <span style={{color:"var(--gold)",flexShrink:0,display:"flex"}}>{Ic.link2}</span>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontSize:13,fontWeight:700,color:"var(--t1)",marginBottom:2}}>{lk.name}</div>
              <a href={lk.url} target="_blank" rel="noopener noreferrer" style={{fontSize:12,color:"#60a5fa",textDecoration:"underline",wordBreak:"break-all"}}>{lk.url}</a>
            </div>
            {(isAdmin||lk.addedBy===userId)&&<button onClick={()=>{if(window.confirm("Remove?"))onLinks((task.links||[]).filter(l=>l.id!==lk.id));}} style={{background:"none",border:"none",color:"var(--t3)",cursor:"pointer",padding:6,display:"flex",alignItems:"center",justifyContent:"center",minHeight:32,minWidth:32}}>{Ic.x}</button>}
          </div>)}
        </div>}
        {showAddLink?<div style={{display:"flex",flexDirection:"column",gap:8,background:"rgba(74,222,128,0.04)",border:"1px solid rgba(74,222,128,0.2)",borderRadius:12,padding:12}}>
          <input placeholder="Link name (e.g. Product Sheet…)" value={newLinkName} onChange={ev=>setNewLinkName(ev.target.value)} className="inp"/>
          <input placeholder="URL (https://…)" value={newLinkUrl} onChange={ev=>setNewLinkUrl(ev.target.value)} className="inp"/>
          <div style={{display:"flex",gap:8}}>
            <button className="btn" style={{...btnPrimary,padding:"10px 16px",fontSize:13,flex:1}}
              onClick={()=>{
                if(!newLinkName.trim())return alert("Enter a link name");
                if(!newLinkUrl.trim()||!newLinkUrl.startsWith("http"))return alert("Enter a valid URL starting with http");
                const updated=[...(task.links||[]),{id:Date.now().toString(36)+Math.random().toString(36).slice(2),name:newLinkName.trim(),url:newLinkUrl.trim(),addedBy:userId,addedAt:new Date().toISOString()}];
                onLinks(updated);setNewLinkName("");setNewLinkUrl("");setShowAddLink(false);
              }}>Add Link</button>
            <button className="btn" style={{...btnSec,padding:"10px 14px",fontSize:13}}
              onClick={()=>{setShowAddLink(false);setNewLinkName("");setNewLinkUrl("");}}>Cancel</button>
          </div>
        </div>:<button className="btn" style={{...btnSec,padding:"10px 16px",fontSize:13,display:"flex",alignItems:"center",gap:6,alignSelf:"flex-start"}} onClick={()=>setShowAddLink(true)}>{Ic.link2} Add Resource Link</button>}
      </FS>

      {/* ── SUBTASKS ── */}
      {(()=>{const subs=task.subtasks||[];const done=subs.filter(s=>s.completed).length;const pct=subs.length?Math.round((done/subs.length)*100):0;return<FS label={`Subtasks (${done}/${subs.length})`}>
        {subs.length>0&&<div style={{marginBottom:10}}>
          <div style={{background:"rgba(255,255,255,0.07)",borderRadius:99,height:6,overflow:"hidden"}}>
            <div style={{background:"var(--gold)",borderRadius:99,height:"100%",width:`${pct}%`,transition:"width 0.35s"}}/>
          </div>
          <div style={{fontSize:11,color:"var(--t3)",marginTop:4,textAlign:"right"}}>{pct}% complete</div>
        </div>}
        {subs.length>0&&<div style={{display:"flex",flexDirection:"column",gap:6,marginBottom:10}}>
          {subs.map((st,idx)=>{
            const stMember=TEAM.find(m=>m.id===st.assignedTo);
            const canToggle=isAdmin||st.assignedTo===userId;
            return<div key={st.id} style={{display:"flex",alignItems:"center",gap:10,background:"var(--elevated)",border:"1px solid var(--border)",borderRadius:10,padding:"10px 12px",opacity:st.completed?0.6:1,transition:"opacity 0.2s"}}>
              <span style={{fontSize:11,color:"var(--t3)",fontWeight:700,minWidth:16,textAlign:"center"}}>{idx+1}</span>
              <button onClick={()=>{if(!canToggle)return;onSubtasks(subs.map(s=>s.id===st.id?{...s,completed:!s.completed}:s));}}
                style={{background:st.completed?"var(--gold)":"none",border:`2px solid ${st.completed?"var(--gold)":"var(--border)"}`,borderRadius:6,width:20,height:20,flexShrink:0,cursor:canToggle?"pointer":"default",display:"flex",alignItems:"center",justifyContent:"center",color:"var(--sidebar)",padding:0,transition:"all 0.2s"}}>
                {st.completed&&<svg width="11" height="11" viewBox="0 0 12 12"><polyline points="2,6 5,9 10,3" stroke="currentColor" strokeWidth="2.2" fill="none" strokeLinecap="round" strokeLinejoin="round"/></svg>}
              </button>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontSize:13,fontWeight:600,color:"var(--t1)",textDecoration:st.completed?"line-through":"none"}}>{st.title}</div>
                {stMember&&<div style={{display:"flex",alignItems:"center",gap:5,marginTop:3}}><Av member={stMember} photo={profiles[stMember.id]} size={14}/><span style={{fontSize:11,color:"var(--t3)"}}>{stMember.name.split(" ")[0]}</span></div>}
                {!stMember&&<div style={{fontSize:11,color:"var(--t3)",marginTop:2}}>Unassigned</div>}
              </div>
              {isAdmin&&<button onClick={()=>{if(window.confirm("Remove this subtask?"))onSubtasks(subs.filter(s=>s.id!==st.id));}}
                style={{background:"none",border:"none",color:"var(--t3)",cursor:"pointer",padding:6,display:"flex",alignItems:"center",justifyContent:"center",minHeight:32,minWidth:32}}>{Ic.x}</button>}
            </div>;})}
        </div>}
        {isAdmin&&(showAddSubtask
          ?<div style={{display:"flex",flexDirection:"column",gap:8,background:"rgba(201,169,110,0.04)",border:"1px solid rgba(201,169,110,0.2)",borderRadius:12,padding:12}}>
            <input placeholder="Subtask title…" value={newSubtaskTitle} onChange={ev=>setNewSubtaskTitle(ev.target.value)} className="inp" autoFocus
              onKeyDown={ev=>{if(ev.key==="Enter"){ev.preventDefault();if(!newSubtaskTitle.trim())return;onSubtasks([...subs,{id:Date.now().toString(36)+Math.random().toString(36).slice(2),title:newSubtaskTitle.trim(),completed:false,assignedTo:newSubtaskAssignee||null,order:subs.length,createdBy:userId,createdAt:new Date().toISOString()}]);setNewSubtaskTitle("");setNewSubtaskAssignee("");setShowAddSubtask(false);}}}/>
            <select value={newSubtaskAssignee} onChange={ev=>setNewSubtaskAssignee(ev.target.value)} className="inp" style={{padding:"9px 12px",fontSize:13}}>
              <option value="">Assign to… (optional)</option>
              {TEAM.map(m=><option key={m.id} value={m.id}>{m.name} — {m.title}</option>)}
            </select>
            <div style={{display:"flex",gap:8}}>
              <button className="btn" style={{...btnPrimary,padding:"10px 16px",fontSize:13,flex:1}}
                onClick={()=>{
                  if(!newSubtaskTitle.trim())return alert("Enter a subtask title");
                  onSubtasks([...subs,{id:Date.now().toString(36)+Math.random().toString(36).slice(2),title:newSubtaskTitle.trim(),completed:false,assignedTo:newSubtaskAssignee||null,order:subs.length,createdBy:userId,createdAt:new Date().toISOString()}]);
                  setNewSubtaskTitle("");setNewSubtaskAssignee("");setShowAddSubtask(false);
                }}>Add Subtask</button>
              <button className="btn" style={{...btnSec,padding:"10px 14px",fontSize:13}}
                onClick={()=>{setShowAddSubtask(false);setNewSubtaskTitle("");setNewSubtaskAssignee("");}}>Cancel</button>
            </div>
          </div>
          :<button className="btn" style={{...btnSec,padding:"10px 16px",fontSize:13,display:"flex",alignItems:"center",gap:6,alignSelf:"flex-start"}} onClick={()=>setShowAddSubtask(true)}>{Ic.plus} Add Subtask</button>
        )}
      </FS>;})()}

      {/* ── COMMENTS ── */}
      <FS label={`Comments (${task.comments?.length||0})`}>
        <div style={{display:"flex",flexDirection:"column",gap:10,marginBottom:10}}>
          {task.comments?.map(comment=>{
            const au=TEAM.find(m=>m.id===comment.author);
            const me=comment.author===userId;
            const likes=comment.likes||[];
            const iLiked=likes.includes(userId);
            const isEditingThis=editingCmt?.id===comment.id;
            return <div key={comment.id} style={{display:"flex",flexDirection:me?"row-reverse":"row",alignItems:"flex-end",gap:7,minWidth:0}}>
              <Av member={au} photo={profiles[au?.id]} size={26}/>
              <div style={{maxWidth:"78%",minWidth:0,display:"flex",flexDirection:"column",gap:3}}>
                {isEditingThis?
                  <div style={{background:me?"var(--gdim)":"var(--elevated)",border:`1px solid ${me?"rgba(201,169,110,0.25)":"var(--border)"}`,borderRadius:14,padding:"8px 10px",display:"flex",flexDirection:"column",gap:6}}>
                    <textarea value={editingCmt.text} onChange={ev=>setEditingCmt(ec=>({...ec,text:ev.target.value}))} autoFocus className="inp" style={{minHeight:60,fontSize:13}}/>
                    <div style={{display:"flex",gap:6}}>

async function handleBriefAttach(briefId, e){

if(!files.length)return;
setBriefAttachUploading(true);
const newItems=[];
for(const file of files){
try{
const ext=file.name.split(".").pop();
const path=`briefs/${briefId}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2)}.${ext}`;
const{error}=await sb.storage.from("task-attachments").upload(path,file,{cacheControl:"3600",upsert:false});
if(error){alert("Upload failed: "+error.message);continue;}
const{data:{publicUrl}}=sb.storage.from("task-attachments").getPublicUrl(path);
newItems.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2),url:publicUrl,path,name:file.name,uploadedBy:userId,uploadedAt:new Date().toISOString(),note:""});
}catch(err){alert("Error: "+err.message);}
}
if(newItems.length){
const{data:row}=await sb.from("maha_briefs").select("attachments").eq("id",briefId).single();
const existing=Array.isArray(row?.attachments)?row.attachments:[];
await sb.from("maha_briefs").update({attachments:[...existing,...newItems]}).eq("id",briefId);
loadBriefs();
}
setBriefAttachUploading(false);
e.target.value="";
}

if(!window.confirm("Remove this image?"))return;
const{data:row}=await sb.from("maha_briefs").select("attachments").eq("id",briefId).single();
const att=(row?.attachments||[]).find(a=>a.id===attachId);
if(att?.path)await sb.storage.from("task-attachments").remove([att.path]);
await sb.from("maha_briefs").update({attachments:(row?.attachments||[]).filter(a=>a.id!==attachId)}).eq("id",briefId);
loadBriefs();
}
async function saveBriefAttachNote(briefId, attachId, noteText){
try{
const{data:row}=await sb.from("maha_briefs").select("attachments").eq("id",briefId).single();
const base=Array.isArray(row?.attachments)?row.attachments:[];
const updated=base.map(a=>a.id===attachId?{...a,note:noteText}:a);
await sb.from("maha_briefs").update({attachments:updated}).eq("id",briefId);
setEditingBriefNote(null);
loadBriefs();
}catch(err){alert("Error saving note: "+err.message);}
}
async function startRec(){
try{
const stream=await navigator.mediaDevices.getUserMedia({audio:true});
chunksRef.current=[];
const mr=new MediaRecorder(stream,{mimeType:MediaRecorder.isTypeSupported("audio/webm")?"audio/webm":"audio/mp4"});
mr.ondataavailable=ev=>{if(ev.data.size>0)chunksRef.current.push(ev.data);};
mr.onstop=async()=>{
stream.getTracks().forEach(t=>t.stop());
const blob=new Blob(chunksRef.current,{type:mr.mimeType});
setUploadingVoice(true);
const ext=mr.mimeType.includes("webm")?"webm":"mp4";
const path=`briefs/voice_${Date.now().toString(36)}.${ext}`;
const{error}=await sb.storage.from("task-attachments").upload(path,blob,{contentType:mr.mimeType,upsert:false});
if(!error){
const{data:{publicUrl}}=sb.storage.from("task-attachments").getPublicUrl(path);
setForm(f=>({...f,voiceUrl:publicUrl,voicePath:path,voiceDuration:recSecs}));
}
setUploadingVoice(false);
};
mr.start();
mediaRef.current=mr;
setRecording(true);setRecSecs(0);
timerRef.current=setInterval(()=>setRecSecs(s=>s+1),1000);
}catch(e){alert("Microphone access needed");}
}
function stopRec(){
if(mediaRef.current&&recording){
mediaRef.current.stop();
clearInterval(timerRef.current);
setRecording(false);
}
}
function fmtS(s){return `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;}
async function saveBrief(){
if(!form.text.trim()&&!form.voiceUrl){alert("Add instructions or a voice note");return;}
await sb.from("maha_briefs").insert([{
text:form.text,urgency:form.urgency,deadline:form.deadline||null,
voice_url:form.voiceUrl||null,voice_duration:form.voiceDuration||null,
assignees:form.assignees.length>0?form.assignees:null,
notes:form.notes||null,
created_by:"maha",created_at:new Date().toISOString()
}]);
setForm({text:"",urgency:"Normal",deadline:"",assignees:[],notes:""});
setShowForm(false);
loadBriefs();
}
async function deleteBrief(id){
if(!window.confirm("Delete this brief?"))return;
await sb.from("maha_briefs").delete().eq("id",id);
loadBriefs();
}

async function handleBriefCmtAttach(briefId, e){
  const file=e.target.files[0];
  if(!file)return;
  setUploadingBriefCmtId(briefId);
  try{
    const ext=file.name.split(".").pop();
    const path=`brief_comments/${Date.now().toString(36)}_${Math.random().toString(36).slice(2)}.${ext}`;
    const {error}=await sb.storage.from("task-attachments").upload(path,file);
    if(error) throw error;
    const {data:{publicUrl}}=sb.storage.from("task-attachments").getPublicUrl(path);
    setCmtText(prev=>{
      const cur = prev[briefId] || "";
      return {...prev, [briefId]: cur + (cur ? "\n" : "") + publicUrl + " "};
    });
  }catch(err){alert("Upload failed: "+err.message);}
  setUploadingBriefCmtId(null);
  e.target.value="";
}

async function updateTask(id,upd){
const row={};
if("status"in upd)row.status=upd.status;
if("signed_by"in upd)row.signed_by=upd.signed_by;
if("title"in upd)row.title=upd.title;
if("description"in upd)row.description=upd.description;
if("priority"in upd)row.priority=upd.priority;
if("assigned_to"in upd)row.assigned_to=upd.assigned_to;
if("deadline"in upd)row.deadline=upd.deadline||null;
if("attachments"in upd)row.attachments=upd.attachments;
if("links"in upd)row.links=upd.links;
if("instructions"in upd)row.instructions=upd.instructions;
if("pinned"in upd)row.pinned=upd.pinned;
if("subtasks" in upd) row.subtasks = upd.subtasks;
await sb.from("tasks").update(row).eq("id",id);
refreshTasks();

const targets=[...new Set([...assignees,...others])].filter(id=>id!==userId);

}

const admins=["mohamed","maha","bassant"].filter(id=>id!==userId);

}

refreshTasks();
const task=tasks.find(t=>t.id===tid);
if(!task)return;
const sender=TEAM.find(m=>m.id===userId)?.name;
const mentionRegex=/@(\w+)/g;
let match;
const mentionedIds=[];
while((match=mentionRegex.exec(text))!==null){
const firstName=match[1].toLowerCase();
const member=TEAM.find(m=>m.name.split(" ")[0].toLowerCase()===firstName);
if(member&&member.id!==userId)mentionedIds.push(member.id);
}

const assignees=getAssignees(task);
const admins=["mohamed","maha","bassant"];

}

// Global Arabic font enforcer - runs after every React render
function applyArabicFont(root){
const arabicRx=/[؀-ۿݐ-ݿࢠ-ࣿﭐ-﷿ﹰ-﻿]/;
function walk(node){
if(node.nodeType===3){
const txt=node.textContent||"";
if(arabicRx.test(txt)&&node.parentElement){
const el=node.parentElement;
if(!el.style.fontFamily.includes("Alexandria")){
el.style.fontFamily="'Alexandria',sans-serif";
el.style.direction="rtl";
el.style.unicodeBidi="embed";
el.style.textAlign="right";
}
}
}else{
node.childNodes.forEach(walk);
}
}
walk(root||document.getElementById("root"));
}
const arabicObserver=new MutationObserver(()=>applyArabicFont());
arabicObserver.observe(document.getElementById("root"),{childList:true,subtree:true,characterData:true});
setTimeout(applyArabicFont,500);
</script>
