<script>
  window.OneSignalDeferred = window.OneSignalDeferred || [];

  OneSignalDeferred.push(async function(OneSignal) {
    await OneSignal.init({
      appId: "397aeb96-2c45-4cd8-9a5e-da6c2625281b",
      serviceWorkerPath: "/muhra/OneSignalSDKWorker.js",
      serviceWorkerParam: { scope: "/muhra/" },
      notifyButton: { enable: false },
      allowLocalhostAsSecureOrigin: true,
    });
    console.log("OneSignal initialized successfully");
  });

  // Called after login - sets external user ID in OneSignal
  // This links the device to the user without needing token management
  window.registerUserWithOneSignal = async function(userId) {
    try {
      if (typeof OneSignal === "undefined") {
        console.log("OneSignal not ready, retrying...");
        setTimeout(() => window.registerUserWithOneSignal(userId), 2000);
        return;
      }
      console.log("Registering user with OneSignal:", userId);
      // Set external user ID - OneSignal maps this to subscription
      const cleanId = userId.replace(/[^a-zA-Z0-9_-]/g, "");
    console.log("OneSignal.login with cleanId:", cleanId);
    await OneSignal.login(cleanId);
      console.log("OneSignal login complete for:", userId);
      // Request permission
      if (Notification.permission === "default") {
        const perm = await Notification.requestPermission();
        console.log("Notification permission:", perm);
      }
      if (Notification.permission === "granted") {
        await OneSignal.User.PushSubscription.optIn();
        console.log("Opted in to push");
      }
      // Now save the subscription ID to Supabase
      await saveSubscriptionToSupabase(cleanId);
    } catch(e) {
      console.log("registerUserWithOneSignal error:", e);
    }
  };

  window.saveSubscriptionToSupabase = async function(userId) {
    try {
      const SUPA_URL = "https://ltwzmjqrlvqbndmipufm.supabase.co";
      const SUPA_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx0d3ptanFybHZxYm5kbWlwdWZtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcxMDA3NTEsImV4cCI6MjA5MjY3Njc1MX0.pvp5NFr2tOTw_MJHIxHO9kK7cQ75QjL5N8AcewXIVOM";
      
      // Get the OneSignal subscription ID (more reliable than token)
      let subId = null;
      let attempts = 0;
      
      while (!subId && attempts < 15) {
        attempts++;
        subId = OneSignal.User?.PushSubscription?.id;
        const token = OneSignal.User?.PushSubscription?.token;
        console.log(`Attempt ${attempts}: subId=${subId}, token=${token ? token.slice(0,15)+"..." : "none"}`);
        if (!subId && !token) {
          await new Promise(r => setTimeout(r, 2000));
        } else {
          subId = subId || token;
          break;
        }
      }

      if (!subId) {
        console.log("Could not get subscription ID after", attempts, "attempts");
        return;
      }

      console.log("Saving to Supabase - userId:", userId, "subId:", subId.slice(0,20)+"...");
      
      const res = await fetch(SUPA_URL + "/rest/v1/push_tokens", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "apikey": SUPA_ANON,
          "Authorization": "Bearer " + SUPA_ANON,
          "Prefer": "resolution=merge-duplicates"
        },
        body: JSON.stringify({
          user_id: userId,
          token: subId,
          updated_at: new Date().toISOString()
        })
      });
      
      const responseText = await res.text();
      console.log("Supabase save result:", res.status, responseText);
      
      if (res.ok || res.status === 201 || res.status === 200) {
        console.log("✅ Token saved successfully for", userId);
      }
    } catch(e) {
      console.log("saveSubscriptionToSupabase error:", e);
    }
  };

  // Manual enable button handler
  window.requestNotificationPermission = async function() {
    const userId = localStorage.getItem("muhra_uid_v3");
    if (userId) await window.registerUserWithOneSignal(userId);
  };
</script>

function SmartText({text,style={}}){
  if(!text)return null;
  const parts=text.split(/(https?:\/\/[^\s]+)/);
  const hasArabic=isArabic(text);
  return <span style={{wordBreak:"break-word",overflowWrap:"anywhere",whiteSpace:"pre-wrap",...style,...(hasArabic?arabicStyle:{})}}>
    {parts.map((part,i)=>
      /^https?:\/\//.test(part)
        ?<a key={i} href={part} target="_blank" rel="noopener noreferrer" style={{color:"#2563eb",textDecoration:"underline",wordBreak:"break-all"}}>{part}</a>
        :<span key={i}>{part}</span>
    )}
  </span>;
}
function Linkify({text}){return <SmartText text={text}/>;}


function CommentText({text,profiles}){
  if(!text)return null;
  const isUrl=s=>/^https?:\/\//.test(s);
  const isMention=s=>/^@\w+/.test(s);
  const combined=/(https?:\/\/[^\s]+|@\w+)/;
  const parts=text.split(combined);
  return <span style={{wordBreak:"break-word",overflowWrap:"anywhere",whiteSpace:"pre-wrap"}}>
    {parts.map((part,i)=>{
      if(isUrl(part))return <a key={i} href={part} target="_blank" rel="noopener noreferrer" style={{color:"#60a5fa",textDecoration:"underline",wordBreak:"break-all"}}>{part}</a>;
      if(isMention(part)){
        const name=part.slice(1);
        const member=TEAM.find(m=>m.name.split(" ")[0].toLowerCase()===name.toLowerCase());
        return <span key={i} style={{background:member?"rgba(201,169,110,0.25)":"rgba(150,150,150,0.15)",color:member?"#c9a96e":"#6b7280",fontWeight:700,borderRadius:4,padding:"1px 4px"}}>{part}</span>;
      }
      return <span key={i}>{part}</span>;
    })}
  </span>;
}

  const recTimerRef=useRef(null);
  const chunksRef=useRef([]);
  const fileRef=useRef(null);
  const cmtInputRef=useRef(null);
  const botRef=useRef(null);

  useEffect(()=>{setTimeout(()=>botRef.current?.scrollIntoView({behavior:"smooth"}),80)},[task.comments?.length]);
  useEffect(()=>{setInstrText(task.instructions?.text||"");},[task.id]);

  const assignees=(Array.isArray(task.assigned_to)?task.assigned_to:[task.assigned_to]).filter(Boolean).map(id=>TEAM.find(m=>m.id===id)).filter(Boolean);
  const cr=TEAM.find(m=>m.id===task.created_by);
  const pm=PM[task.priority]||PM.Medium;
  const od=isOD(task.deadline,task.status);
  const sig=task.signed_by?.includes(userId);
  const assignedIds=(Array.isArray(task.assigned_to)?task.assigned_to:[task.assigned_to]).filter(Boolean);
  const canSign=assignedIds.includes(userId)&&!sig&&task.status==="Done";
  const canStatus=isAdmin||assignedIds.includes(userId);
  const inp={width:"100%",padding:"10px 13px",borderRadius:10,border:"1.5px solid #e5e7eb",fontSize:14,color:"#111",outline:"none",background:"#fafafa",boxSizing:"border-box"};

  async function startRecording(){
    try{
      const stream=await navigator.mediaDevices.getUserMedia({audio:true});
      chunksRef.current=[];
      const mr=new MediaRecorder(stream,{mimeType:MediaRecorder.isTypeSupported("audio/webm")?"audio/webm":"audio/mp4"});
      mr.ondataavailable=ev=>{if(ev.data.size>0)chunksRef.current.push(ev.data);};
      mr.onstop=async()=>{
        stream.getTracks().forEach(t=>t.stop());
        const blob=new Blob(chunksRef.current,{type:mr.mimeType});
        await uploadVoice(blob,mr.mimeType);
      };
      mr.start();
      mediaRecRef.current=mr;
      setRecording(true);
      setRecSeconds(0);
      recTimerRef.current=setInterval(()=>setRecSeconds(s=>s+1),1000);
    }catch(err){alert("Microphone access denied. Please allow microphone access and try again.");}
  }

  function stopRecording(){
    if(mediaRecRef.current&&recording){
      mediaRecRef.current.stop();
      clearInterval(recTimerRef.current);
      setRecording(false);
      setUploadingVoice(true);
    }
  }

  async function uploadVoice(blob,mimeType){
    try{
      const ext=mimeType.includes("webm")?"webm":"mp4";
      const path=`${task.id}/voice_${Date.now().toString(36)}.${ext}`;
      const {error}=await sb.storage.from("task-attachments").upload(path,blob,{contentType:mimeType,upsert:false});
      if(error){alert("Failed to upload voice note: "+error.message);setUploadingVoice(false);return;}
      const {data:{publicUrl}}=sb.storage.from("task-attachments").getPublicUrl(path);
      const voices=[...(task.instructions?.voices||[]),{id:Date.now().toString(36)+Math.random().toString(36).slice(2),url:publicUrl,path,uploadedBy:userId,uploadedAt:new Date().toISOString(),duration:recSeconds}];
      await sb.from("tasks").update({instructions:{text:task.instructions?.text||"",voices}}).eq("id",task.id);
      setUploadingVoice(false);
    }catch(err){alert("Error: "+err.message);setUploadingVoice(false);}
  }

  async function deleteVoice(id){
    if(!window.confirm("Delete this voice note?"))return;
    const v=(task.instructions?.voices||[]).find(x=>x.id===id);
    if(v?.path)await sb.storage.from("task-attachments").remove([v.path]);
    const voices=(task.instructions?.voices||[]).filter(x=>x.id!==id);
    await sb.from("tasks").update({instructions:{text:task.instructions?.text||"",voices}}).eq("id",task.id);
  }

  async function saveInstructions(){
    setInstrSaving(true);
    await sb.from("tasks").update({instructions:{text:instrText,voices:task.instructions?.voices||[]}}).eq("id",task.id);
    setInstrSaving(false);
  }

  function fmtSec(s){const m=Math.floor(s/60);const sec=s%60;return `${m}:${sec.toString().padStart(2,"0")}`;}

  async function handleAttach(e){
    const files=Array.from(e.target.files).filter(f=>f.type.startsWith("image/"));
    if(!files.length)return;
    const valid=files.filter(f=>f.size<=10*1024*1024);
    if(files.length>valid.length)alert(`${files.length-valid.length} file(s) over 10MB skipped`);
    if(!valid.length)return;
    setUploading(true);
    const newItems=[];
    for(const file of valid){
      try{
        const ext=file.name.split(".").pop();
        const path=`${task.id}/${Date.now().toString(36)}_${Math.random().toString(36).slice(2)}.${ext}`;
        const {error}=await sb.storage.from("task-attachments").upload(path,file,{cacheControl:"3600",upsert:false});
        if(error){alert("Upload failed: "+error.message);continue;}
        const {data:{publicUrl}}=sb.storage.from("task-attachments").getPublicUrl(path);
        newItems.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2),url:publicUrl,path,name:file.name,uploadedBy:userId,uploadedAt:new Date().toISOString(),note:""});
      }catch(err){alert("Error: "+err.message);}
    }
    if(newItems.length){const existing=task.attachments||[];await onAttach([...existing,...newItems]);}
    setUploading(false);
    e.target.value="";
  }

  async function removeAttach(id){
    if(!window.confirm("Remove this image?"))return;
    const at=(task.attachments||[]).find(a=>a.id===id);
    if(at?.path)await sb.storage.from("task-attachments").remove([at.path]);
    await onAttach((task.attachments||[]).filter(a=>a.id!==id));
  }

  async function saveNote(atId,noteText){
    try{
      const {data:row}=await sb.from("tasks").select("attachments").eq("id",task.id).single();
      const base=Array.isArray(row?.attachments)?row.attachments:(task.attachments||[]);
      const updated=base.map(a=>a.id===atId?{...a,note:noteText}:a);
      const {error}=await sb.from("tasks").update({attachments:updated}).eq("id",task.id);
      if(error){alert("Failed: "+error.message);return;}
      setEditingNote(null);
    }catch(err){alert("Error: "+err.message);}
  }

  function insertMention(memberName){
    const tag="@"+memberName.split(" ")[0]+" ";
    setCmt(prev=>prev+tag);
    setShowMentions(false);
    setTimeout(()=>cmtInputRef.current?.focus(),50);
  }

  async function handleEditComment(commentId,newText){
    if(!newText.trim())return;
    await sb.from("comments").update({text:newText.trim(),edited:true}).eq("id",commentId);
    setEditingCmt(null);
    refreshTasks();
  }

  async function toggleLike(commentId){
    const comment=task.comments?.find(x=>x.id===commentId);
    if(!comment)return;
    const likes=comment.likes||[];
    const updated=likes.includes(userId)?likes.filter(id=>id!==userId):[...likes,userId];
    await sb.from("comments").update({likes:updated}).eq("id",commentId);
    refreshTasks();
  }

  function sendComment(){
    if(!cmt.trim())return;
    onComment(cmt.trim());
    setCmt("");
    setShowMentions(false);
  }

  return <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.55)",backdropFilter:"blur(5px)",zIndex:100,display:"flex",alignItems:"flex-end",justifyContent:"center"}} onClick={ev=>ev.target===ev.currentTarget&&onClose()}>
    <div style={{background:"#fff",borderRadius:"22px 22px 0 0",width:"100%",maxWidth:480,maxHeight:"94vh",overflowY:"auto",animation:"slideUp 0.28s ease"}}>
      <div style={{width:40,height:4,background:"#e5e7eb",borderRadius:4,margin:"12px auto 0"}}/>
      <div style={{padding:"14px 20px 12px",display:"flex",alignItems:"center",justifyContent:"space-between",position:"sticky",top:0,background:"#fff",zIndex:1,borderBottom:"1px solid #f3f4f6"}}>
        <button style={{background:"none",border:"none",fontSize:15,fontWeight:700,color:"#1a1a2e",padding:"5px 0"}} onClick={onClose}>← Back</button>
        <div style={{display:"flex",gap:8}}>
          {isAdmin&&!editMode&&<button style={{background:"#f3f4f6",border:"none",width:36,height:36,borderRadius:10,fontSize:16}} onClick={()=>{setEf({title:task.title,description:task.description||"",deadline:task.deadline||"",priority:task.priority,assigned_to:Array.isArray(task.assigned_to)?task.assigned_to:[task.assigned_to].filter(Boolean)});setEditMode(true);}}>✏️</button>}
          {isAdmin&&<button style={{background:"#fef2f2",border:"none",width:36,height:36,borderRadius:10,fontSize:16,color:"#dc2626"}} onClick={()=>window.confirm("Delete this task?")&&onDelete()}>🗑</button>}
        </div>
      </div>

      <div style={{padding:"16px 20px 44px",display:"flex",flexDirection:"column",gap:16}}>

        {/* ── EDIT MODE ── */}
        {editMode&&isAdmin?<div style={{display:"flex",flexDirection:"column",gap:12}}>
          <FL>Title</FL><input style={inp} value={ef.title} onChange={ev=>setEf(f=>({...f,title:ev.target.value}))}/>
          <FL>Description</FL><textarea style={{...inp,minHeight:80}} value={ef.description} onChange={ev=>setEf(f=>({...f,description:ev.target.value}))}/>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
            <div><FL>Priority</FL><select style={inp} value={ef.priority} onChange={ev=>setEf(f=>({...f,priority:ev.target.value}))}>{PRIO.map(p=><option key={p}>{p}</option>)}</select></div>
            <div><FL>Deadline</FL><input type="date" style={inp} value={ef.deadline} onChange={ev=>setEf(f=>({...f,deadline:ev.target.value}))}/></div>
          </div>
          <FL>Assign To</FL>
          <div style={{display:"flex",flexDirection:"column",gap:6}}>
            {TEAM.map(m=>{
              const cur=Array.isArray(ef.assigned_to)?ef.assigned_to:[ef.assigned_to].filter(Boolean);
              const sel=cur.includes(m.id);
              return <div key={m.id} onClick={()=>setEf(f=>{const c2=Array.isArray(f.assigned_to)?f.assigned_to:[f.assigned_to].filter(Boolean);return {...f,assigned_to:c2.includes(m.id)?c2.filter(x=>x!==m.id):[...c2,m.id]};})}
                style={{display:"flex",alignItems:"center",gap:10,padding:"8px 10px",borderRadius:10,border:`1.5px solid ${sel?"#1a1a2e":"#e5e7eb"}`,background:sel?"#f0f0f8":"#fafafa",cursor:"pointer"}}>
                <Av member={m} photo={profiles[m.id]} size={26}/>
                <div style={{flex:1,fontSize:13,fontWeight:600,color:"#111"}}>{m.name}</div>
                <div style={{width:18,height:18,borderRadius:5,border:`2px solid ${sel?"#1a1a2e":"#d1d5db"}`,background:sel?"#1a1a2e":"#fff",display:"flex",alignItems:"center",justifyContent:"center"}}>
                  {sel&&<span style={{color:"#c9a96e",fontSize:12,fontWeight:900}}>✓</span>}
                </div>
              </div>;})}
          </div>
          <div style={{display:"flex",gap:8}}>
            <button className="mbtn" style={{background:"#1a1a2e",color:"#c9a96e",border:"none",borderRadius:12,padding:"12px 20px",fontSize:14,fontWeight:700}} onClick={async()=>{await onEdit(ef);setEditMode(false);}}>Save</button>
            <button className="mbtn" style={{background:"#f3f4f6",color:"#374151",border:"none",borderRadius:12,padding:"10px 16px",fontSize:14,fontWeight:600}} onClick={()=>setEditMode(false)}>Cancel</button>
          </div>
        </div>:

        /* ── VIEW MODE ── */
        <div style={{display:"flex",flexDirection:"column",gap:16}}>
          <div style={{display:"flex",gap:10,alignItems:"flex-start"}}>
            <div style={{flex:1}}>
              <h2 style={{fontSize:21,fontWeight:900,color:"#111",margin:0,lineHeight:1.25}}><SmartText text={task.title}/></h2>
              <div style={{fontSize:12,color:"#9ca3af",marginTop:5}}>By {cr?.name} · {fD(task.created_at)}</div>
            </div>
            <span style={{display:"inline-flex",alignItems:"center",fontSize:11,fontWeight:700,padding:"3px 9px",borderRadius:20,background:pm.bg,color:pm.text,border:`1px solid ${pm.border}`,flexShrink:0}}>
              <span style={{width:6,height:6,borderRadius:"50%",background:pm.dot,display:"inline-block",marginRight:4}}/>{task.priority}
            </span>
          </div>

          {task.description&&<FS label="Description"><p style={{fontSize:14,color:"#374151",lineHeight:1.65,margin:0,wordBreak:"break-word"}}><SmartText text={task.description}/></p></FS>}

          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
            <FS label={`Assigned (${assignees.length})`}>
              <div style={{display:"flex",flexDirection:"column",gap:6}}>
                {assignees.map(a=><div key={a.id} style={{display:"flex",alignItems:"center",gap:8}}>
                  <Av member={a} photo={profiles[a.id]} size={28}/>
                  <div><div style={{fontSize:13,fontWeight:600}}>{a.name}</div><div style={{fontSize:11,color:"#9ca3af"}}>{a.title}</div></div>
                </div>)}
              </div>
            </FS>
            <FS label="Deadline"><div style={{fontSize:15,fontWeight:700,color:od?"#dc2626":"#111"}}>{od?"⚠ ":""}{fD(task.deadline)}</div></FS>
          </div>

          <FS label="Status">
            <div style={{display:"flex",flexWrap:"wrap",gap:7}}>
              {STAT.map(s=>{const sm=SM[s];const active=task.status===s;
                return <button key={s} disabled={!canStatus} className="mbtn"
                  style={{padding:"7px 15px",borderRadius:20,fontSize:12,fontWeight:active?700:500,cursor:canStatus?"pointer":"default",border:`1.5px solid ${active?sm.text:"#e5e7eb"}`,background:active?sm.bg:"#fff",color:active?sm.text:"#9ca3af"}}
                  onClick={()=>canStatus&&onStatusChange(s)}>{s}</button>;})}
            </div>
          </FS>

          {task.signed_by?.length>0&&<FS label="Signed By">
            <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
              {task.signed_by.map(uid=>{const m=TEAM.find(t=>t.id===uid);return m?<Av key={uid} member={m} photo={profiles[uid]} size={30} title={m.name}/>:null})}
            </div>
          </FS>}
          {canSign&&<button className="mbtn" style={{background:"#1a1a2e",color:"#c9a96e",border:"none",borderRadius:12,padding:"12px 20px",fontSize:14,fontWeight:700}} onClick={onSign}>✅ Sign & Approve Task</button>}
          {sig&&<div style={{fontSize:13,color:"#15803d",fontWeight:700}}>✅ You signed this task</div>}

          {!isAdmin&&<div>
            <button className="mbtn" style={{background:"#f3f4f6",color:"#374151",border:"none",borderRadius:12,padding:"10px 16px",fontSize:14,fontWeight:600}} onClick={()=>setShowReq(!showReq)}>📝 Request Edit</button>
            {showReq&&<div style={{display:"flex",flexDirection:"column",gap:8,marginTop:8}}>
              <textarea placeholder="Describe what needs to change…" value={note} onChange={ev=>setNote(ev.target.value)} style={{...inp,minHeight:70}}/>
              <button className="mbtn" style={{background:"#1a1a2e",color:"#c9a96e",border:"none",borderRadius:12,padding:"12px 20px",fontSize:14,fontWeight:700}} onClick={async()=>{await onEditReq(note);setNote("");setShowReq(false);}}>Send Request</button>
            </div>}
          </div>}

          {isAdmin&&task.edit_requests?.length>0&&<FS label={`Edit Requests (${task.edit_requests.length})`}>
            {task.edit_requests.map(r=>{const au=TEAM.find(m=>m.id===r.author);
              return <div key={r.id} style={{background:"#fffbeb",border:"1px solid #fde68a",borderRadius:10,padding:"10px 12px",marginBottom:6}}>
                <div style={{fontSize:11,color:"#9ca3af",marginBottom:3}}>{au?.name} · {fD(r.created_at)}</div>
                <div style={{fontSize:13}}>{r.note}</div>
              </div>;})}
          </FS>}

          {/* ── INSTRUCTIONS ── */}
          <FS label="Instructions">
            {/* Text instructions */}
            <textarea
              placeholder="Add text instructions for this task…"
              value={instrText}
              onChange={ev=>setInstrText(ev.target.value)}
              style={{width:"100%",padding:"10px 13px",borderRadius:10,border:"1.5px solid #e5e7eb",fontSize:14,color:"#111",outline:"none",background:"#fafafa",boxSizing:"border-box",minHeight:80,resize:"none",fontFamily:"inherit"}}
            />
            {instrText!==( task.instructions?.text||"")&&<button className="mbtn"
              style={{background:"#1a1a2e",color:"#c9a96e",border:"none",borderRadius:10,padding:"8px 16px",fontSize:13,fontWeight:700,alignSelf:"flex-start"}}
              onClick={saveInstructions}>{instrSaving?"Saving…":"Save Instructions"}</button>}

            {/* Voice notes */}
            <div style={{display:"flex",flexDirection:"column",gap:8}}>
              {(task.instructions?.voices||[]).map(v=>{
                const uploader=TEAM.find(m=>m.id===v.uploadedBy);
                return <div key={v.id} style={{background:"#f8f7f4",border:"1.5px solid #e5e7eb",borderRadius:12,padding:"10px 14px",display:"flex",flexDirection:"column",gap:6}}>
                  <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
                    <div style={{display:"flex",alignItems:"center",gap:8}}>
                      <div style={{width:34,height:34,borderRadius:"50%",background:"#1a1a2e",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
                        <span style={{color:"#c9a96e",fontSize:16}}>🎙️</span>
                      </div>
                      <div>
                        <div style={{fontSize:12,fontWeight:700,color:"#111"}}>Voice Note</div>
                        <div style={{fontSize:10,color:"#9ca3af"}}>{uploader?.name?.split(" ")[0]} · {fD(v.uploadedAt)}{v.duration?` · ${fmtSec(v.duration)}`:""}</div>
                      </div>
                    </div>
                    {(isAdmin||v.uploadedBy===userId)&&<button className="mbtn" onClick={()=>deleteVoice(v.id)}
                      style={{background:"none",border:"none",color:"#9ca3af",fontSize:16,cursor:"pointer",padding:4}}>🗑</button>}
                  </div>
                  <audio controls src={v.url} style={{width:"100%",height:36,borderRadius:8,accentColor:"#1a1a2e"}}/>
                </div>;})}
            </div>

            {/* Record button */}
            <div style={{display:"flex",alignItems:"center",gap:10}}>
              {!recording?
                <button className="mbtn"
                  style={{background:uploadingVoice?"#f3f4f6":"#1a1a2e",color:uploadingVoice?"#9ca3af":"#c9a96e",border:"none",borderRadius:12,padding:"10px 18px",fontSize:13,fontWeight:700,display:"flex",alignItems:"center",gap:8,cursor:uploadingVoice?"default":"pointer"}}
                  onClick={startRecording} disabled={uploadingVoice}>
                  {uploadingVoice?<><span style={{animation:"pulse 1s infinite"}}>⏳</span> Saving voice note…</>:<><span>🎙️</span> Record Voice Note</>}
                </button>
              :
                <button className="mbtn"
                  style={{background:"#dc2626",color:"#fff",border:"none",borderRadius:12,padding:"10px 18px",fontSize:13,fontWeight:700,display:"flex",alignItems:"center",gap:8,cursor:"pointer",animation:"pulse 1s ease infinite"}}
                  onClick={stopRecording}>
                  <span style={{width:10,height:10,background:"#fff",borderRadius:2,display:"inline-block"}}/>
                  Stop · {fmtSec(recSeconds)}
                </button>
              }
            </div>
          </FS>

          {/* ── ATTACHMENTS ── */}
          <FS label={`Attachments (${task.attachments?.length||0})`}>
            {task.attachments?.length>0&&<div style={{display:"flex",flexDirection:"column",gap:10}}>
              {task.attachments.map(at=>{
                const uploader=TEAM.find(m=>m.id===at.uploadedBy);
                const canEdit=isAdmin||at.uploadedBy===userId;
                const isEditingThis=editingNote?.id===at.id;
                return <div key={at.id} style={{background:"#f8f7f4",border:"1.5px solid #e5e7eb",borderRadius:12,overflow:"hidden"}}>
                  <div style={{position:"relative",cursor:"pointer"}} onClick={()=>!isEditingThis&&setLightbox(at)}>
                    <img src={at.url||at.dataUrl} alt={at.name} style={{width:"100%",maxHeight:200,objectFit:"cover",display:"block"}}/>
                    <div style={{position:"absolute",top:6,right:6,display:"flex",gap:4}}>
                      {canEdit&&<button onClick={ev=>{ev.stopPropagation();setEditingNote(isEditingThis?null:{id:at.id,text:at.note||""});}}
                        style={{background:"rgba(0,0,0,0.6)",color:"#fff",border:"none",borderRadius:8,padding:"4px 8px",fontSize:11,fontWeight:600,cursor:"pointer"}}>
                        {isEditingThis?"✕":"📝 Note"}
                      </button>}
                      {canEdit&&<button onClick={ev=>{ev.stopPropagation();removeAttach(at.id);}}
                        style={{background:"rgba(220,38,38,0.8)",color:"#fff",border:"none",borderRadius:8,padding:"4px 8px",fontSize:11,fontWeight:600,cursor:"pointer"}}>🗑</button>}
                    </div>
                    {uploader&&<div style={{position:"absolute",bottom:6,left:8,background:"rgba(0,0,0,0.55)",color:"#fff",fontSize:10,padding:"2px 7px",borderRadius:20,fontWeight:600}}>{uploader.name.split(" ")[0]}</div>}
                  </div>
                  {!isEditingThis&&at.note&&<div style={{padding:"8px 12px",fontSize:13,color:"#374151",lineHeight:1.5,borderTop:"1px solid #e5e7eb",background:"#fff"}}>
                    <span style={{fontSize:10,color:"#9ca3af",fontWeight:700,marginRight:6}}>NOTE</span><SmartText text={at.note}/>
                  </div>}
                  {!isEditingThis&&!at.note&&canEdit&&<div style={{padding:"6px 12px",fontSize:12,color:"#9ca3af",borderTop:"1px solid #f3f4f6",background:"#fff",cursor:"pointer"}} onClick={()=>setEditingNote({id:at.id,text:""})}>+ Add a note…</div>}
                  {isEditingThis&&<div style={{padding:10,borderTop:"1px solid #e5e7eb",background:"#fff",display:"flex",flexDirection:"column",gap:8}}>
                    <textarea placeholder="Add a note to this image…" value={editingNote.text} onChange={ev=>setEditingNote(n=>({...n,text:ev.target.value}))}
                      style={{width:"100%",padding:"9px 12px",borderRadius:9,border:"1.5px solid #e5e7eb",fontSize:13,outline:"none",background:"#fafafa",boxSizing:"border-box",minHeight:70,resize:"none"}} autoFocus/>
                    <div style={{display:"flex",gap:8}}>
                      <button className="mbtn" style={{background:"#1a1a2e",color:"#c9a96e",border:"none",borderRadius:9,padding:"8px 16px",fontSize:13,fontWeight:700,flex:1}}
                        onClick={()=>saveNote(at.id,editingNote.text.trim())}>Save Note</button>
                      <button className="mbtn" style={{background:"#f3f4f6",color:"#374151",border:"none",borderRadius:9,padding:"8px 14px",fontSize:13,fontWeight:600}}
                        onClick={()=>setEditingNote(null)}>Cancel</button>
                    </div>
                  </div>}
                </div>;})}
            </div>}
            <input type="file" accept="image/*" multiple ref={fileRef} style={{display:"none"}} onChange={handleAttach}/>
            <button className="mbtn" style={{background:"#f3f4f6",color:"#374151",border:"none",borderRadius:10,padding:"9px 16px",fontSize:13,fontWeight:600,display:"flex",alignItems:"center",gap:6}} onClick={()=>fileRef.current?.click()} disabled={uploading}>
              {uploading?"⏳ Uploading…":"📎 Add Images"}
            </button>
          </FS>

          {lightbox&&<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.92)",zIndex:200,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:20}} onClick={()=>setLightbox(null)}>
            <img src={lightbox.url||lightbox.dataUrl} alt={lightbox.name} style={{maxWidth:"100%",maxHeight:"75vh",borderRadius:12,objectFit:"contain"}}/>

      <div style={{display:"flex",gap:8}}>
        <button className="mbtn" style={{background:"#c9a96e",color:"#1a1a2e",border:"none",borderRadius:10,padding:"10px 16px",fontSize:13,fontWeight:700,flex:1,opacity:sending?0.7:1}}

      </div>
    </div>}
  </div>;

function App(){
  const [userId,setUserId]=useState(()=>lsG("muhra_uid_v3",null));
  const [tasks,setTasks]=useState([]);
  const [chat,setChat]=useState([]);
  const [profiles,setProfiles]=useState({});
  const [loading,setLoading]=useState(true);
  const [dbError,setDbError]=useState(null);
  const [tab,setTab]=useState("tasks");
  const [selected,setSelected]=useState(null);
  const [showNew,setShowNew]=useState(false);
  const [filterSt,setFilterSt]=useState("All");
  const [filterAs,setFilterAs]=useState("All");

  const user=TEAM.find(m=>m.id===userId);
  const isAdmin=user?.role==="admin";

  useEffect(()=>{if(!userId){setLoading(false);return}loadAll()},[userId]);

  async function loadAll(){
    setLoading(true);
    try{
      const [{data:t,error:te},{data:c},{data:p}]=await Promise.all([
        sb.from("tasks").select("*, comments(*), edit_requests(*)").order("created_at",{ascending:false}),
        sb.from("chat").select("*").order("created_at"),
        sb.from("profiles").select("*"),
      ]);
      if(te)throw te;
      setTasks(t||[]);setChat(c||[]);
      const pm={};(p||[]).forEach(r=>{pm[r.user_id]=r.photo_url});setProfiles(pm);
      setDbError(null);
    }catch(e){console.error(e);setDbError(true)}
    setLoading(false);
  }

  useEffect(()=>{
    if(!userId)return;
    const ch1=sb.channel("rt-t").on("postgres_changes",{event:"*",schema:"public",table:"tasks"},refreshTasks).on("postgres_changes",{event:"*",schema:"public",table:"comments"},refreshTasks).on("postgres_changes",{event:"*",schema:"public",table:"edit_requests"},refreshTasks).subscribe();
    const ch2=sb.channel("rt-c").on("postgres_changes",{event:"INSERT",schema:"public",table:"chat"},p=>setChat(prev=>[...prev,p.new])).subscribe();
    const ch3=sb.channel("rt-p").on("postgres_changes",{event:"*",schema:"public",table:"profiles"},p=>setProfiles(prev=>({...prev,[p.new.user_id]:p.new.photo_url}))).subscribe();
    return()=>{sb.removeChannel(ch1);sb.removeChannel(ch2);sb.removeChannel(ch3)};
  },[userId]);

  async function refreshTasks(){const{data}=await sb.from("tasks").select("*, comments(*), edit_requests(*)").order("created_at",{ascending:false});if(data){setTasks(data);setSelected(s=>s?data.find(t=>t.id===s.id)||s:null)}}
  async function addTask(form){
    const {data}=await sb.from("tasks").insert([{title:form.title,description:form.description,priority:form.priority,assigned_to:form.assignedTo,created_by:userId,deadline:form.deadline||null,status:"To Do",signed_by:[],attachments:[],links:[],instructions:{text:"",voices:[]}}]).select().single();
    refreshTasks();
    // Notify assignees
    const assignees=(Array.isArray(form.assignedTo)?form.assignedTo:[form.assignedTo]).filter(id=>id!==userId);
    if(assignees.length>0)sendPush(assignees,"📋 New Task Assigned",`${TEAM.find(m=>m.id===userId)?.name} assigned you: "${form.title}"`,data?.id);
    // Notify everyone else about new task
    const others=othersExcept(userId).filter(id=>!assignees.includes(id));
    if(others.length>0)sendPush(others,"🆕 New Task Created",`${TEAM.find(m=>m.id===userId)?.name} created: "${form.title}"`,data?.id);
  }
  async function updateTask(id,upd){
    const row={};
    if("status"in upd)row.status=upd.status;
    if("signed_by"in upd)row.signed_by=upd.signed_by;
    if("title"in upd)row.title=upd.title;
    if("description"in upd)row.description=upd.description;
    if("priority"in upd)row.priority=upd.priority;
    if("assigned_to"in upd)row.assigned_to=upd.assigned_to;
    if("deadline"in upd)row.deadline=upd.deadline||null;
    if("attachments"in upd)row.attachments=upd.attachments;
    if("links"in upd)row.links=upd.links;
    if("instructions"in upd)row.instructions=upd.instructions;
    await sb.from("tasks").update(row).eq("id",id);
    refreshTasks();
    const task=tasks.find(t=>t.id===id);
    if(!task)return;
    const assignees=getAssignees(task);
    const others=othersExcept(userId);
    const sender=TEAM.find(m=>m.id===userId)?.name;
    // Status change notification
    if("status"in upd){
      const targets=[...new Set([...assignees,...others])].filter(id=>id!==userId);
      sendPush(targets,"🔄 Task Status Updated",`${sender} changed "${task.title}" to ${upd.status}`,id);
    }
    // Signed notification
    if("signed_by"in upd){
      const admins=["mohamed","maha","bassant"].filter(id=>id!==userId);
      sendPush(admins,"✅ Task Signed",`${sender} signed off on "${task.title}"`,id);
    }
  }
  async function deleteTask(id){await sb.from("tasks").delete().eq("id",id);setSelected(null);refreshTasks()}
  async function addComment(tid,text){
    await sb.from("comments").insert([{task_id:tid,author:userId,text,likes:[],edited:false}]);
    refreshTasks();
    const task=tasks.find(t=>t.id===tid);
    if(!task)return;
    const sender=TEAM.find(m=>m.id===userId)?.name;
    // Check for @mentions
    const mentionRegex=/@(\w+)/g;
    let match;
    const mentionedIds=[];
    while((match=mentionRegex.exec(text))!==null){
      const firstName=match[1].toLowerCase();
      const member=TEAM.find(m=>m.name.split(" ")[0].toLowerCase()===firstName);
      if(member&&member.id!==userId)mentionedIds.push(member.id);
    }
    // Send mention notifications
    if(mentionedIds.length>0)sendPush(mentionedIds,"@ You were mentioned",`${sender} mentioned you in "${task.title}"`,tid);
    // Send comment notification to assignees + admins (not mentioned ones, not self)
    const assignees=getAssignees(task);
    const admins=["mohamed","maha","bassant"];
    const targets=[...new Set([...assignees,...admins])].filter(id=>id!==userId&&!mentionedIds.includes(id));
    if(targets.length>0)sendPush(targets,"💬 New Comment",`${sender}: "${text.slice(0,60)}${text.length>60?"…":""}"`,tid);
  }
  async function addEditReq(tid,note){
    await sb.from("edit_requests").insert([{task_id:tid,author:userId,note}]);
    refreshTasks();
    const task=tasks.find(t=>t.id===tid);
    const sender=TEAM.find(m=>m.id===userId)?.name;
    const admins=["mohamed","maha","bassant"].filter(id=>id!==userId);
    sendPush(admins,"📝 Edit Request",`${sender} requested an edit on "${task?.title}"`,tid);
  }
  async function signTask(tid){
    const task=tasks.find(t=>t.id===tid);
    if(!task||task.signed_by?.includes(userId))return;
    await updateTask(tid,{signed_by:[...(task.signed_by||[]),userId]});
    const sender=TEAM.find(m=>m.id===userId)?.name;
    const admins=["mohamed","maha","bassant"].filter(id=>id!==userId);
    sendPush(admins,"✅ Task Approved",`${sender} signed off on "${task.title}"`,tid);
  }
  async function sendChat(text){await sb.from("chat").insert([{author:userId,text}])}
  async function updateProfile(mid,dataUrl){await sb.from("profiles").upsert({user_id:mid,photo_url:dataUrl,updated_at:new Date().toISOString()});setProfiles(p=>({...p,[mid]:dataUrl}))}
  function logout(){lsS("muhra_uid_v3",null);setUserId(null);setTasks([]);setChat([]);setSelected(null)}

  const filtered=tasks.filter(t=>(filterSt==="All"||t.status===filterSt)&&(filterAs==="All"||(Array.isArray(t.assigned_to)?t.assigned_to.includes(filterAs):t.assigned_to===filterAs)));

  if(!user)return <Login onLogin={id=>{
    lsS("muhra_uid_v3",id);
    setUserId(id);
    // Register this user with OneSignal after login
    setTimeout(()=>{
      if(typeof window.registerUserWithOneSignal==="function"){
        window.registerUserWithOneSignal(id);
      }
    }, 1500);
  }}/>;

  if(loading)return <div style={{minHeight:"100vh",background:"#1a1a2e",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:20}}>
    <img src="https://cdn.shopify.com/s/files/1/0679/6984/3251/files/MUHRA_APP_LOGO_1.png?v=1777552159" alt="Muhra" style={{width:120,height:120,objectFit:"contain",borderRadius:24}}/>
    <div style={{color:"#c9a96e",fontSize:13,letterSpacing:3,animation:"pulse 1.4s ease infinite"}}>LOADING</div>
  </div>;

  if(dbError)return <div style={{minHeight:"100vh",background:"#1a1a2e",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:16,padding:24,textAlign:"center"}}>
    <Shoe size={48} color="#c9a96e"/>
    <div style={{color:"#f87171",fontSize:17,fontWeight:700}}>Connection Error</div>
    <div style={{color:"#9ca3af",fontSize:14,maxWidth:300,lineHeight:1.65}}>Could not connect to database. Check your internet and try again.</div>
    <button onClick={loadAll} style={{background:"#c9a96e",color:"#1a1a2e",border:"none",borderRadius:10,padding:"11px 22px",fontWeight:700,fontSize:14}}>Try Again</button>
    <button onClick={logout} style={{background:"transparent",color:"#9ca3af",border:"none",fontSize:13,marginTop:4}}>Back to Login</button>
  </div>;

  return <div style={{fontFamily:"'Century Gothic','Nunito',Futura,'Trebuchet MS',sans-serif",background:"#f5f4f0",minHeight:"100vh",maxWidth:960,margin:"0 auto",paddingBottom:110}}>
    {/* HEADER */}
    <header style={{background:"#f5efe6",padding:"10px 24px",display:"flex",alignItems:"center",justifyContent:"space-between",position:"sticky",top:0,zIndex:50,boxShadow:"0 1px 12px rgba(0,0,0,0.08)",borderBottom:"1px solid #e8ddd0"}}>
      <img src="https://cdn.shopify.com/s/files/1/0679/6984/3251/files/logo_muhra.png?v=1777114424" alt="Muhra" style={{height:38,objectFit:"contain"}}/>
      <div style={{display:"flex",alignItems:"center",gap:10}}>
        {"Notification" in window && Notification.permission==="default"&&(
          <button className="mbtn" title="Enable notifications" onClick={()=>window.requestNotificationPermission?.()}
            style={{background:"#1a1a2e",color:"#c9a96e",border:"none",borderRadius:20,padding:"5px 10px",fontSize:11,fontWeight:700,cursor:"pointer"}}>
            🔔 Enable
          </button>
        )}
        <div style={{textAlign:"right"}}><div style={{color:"#3d2b1f",fontSize:12,fontWeight:600}}>{user.name.split(" ")[0]}</div><div style={{color:"#9c7c5a",fontSize:10}}>{isAdmin?"Admin":"Member"}</div></div>
        <Av member={user} photo={profiles[user.id]} size={36} onClick={logout} title="Tap to logout"/>
      </div>
    </header>

    {/* GREETING */}
    <div style={{padding:"16px 20px 10px"}}>
      <div style={{fontSize:19,fontWeight:800,color:"#111"}}>Hello, {user.name.split(" ")[0]} 👋</div>
      <div style={{fontSize:12,color:"#9ca3af",marginTop:2}}>{user.title}</div>
    </div>

    {/* STATS */}
    <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:8,padding:"0 20px 14px"}}>
      {[["Mine",tasks.filter(t=>Array.isArray(t.assigned_to)?t.assigned_to.includes(userId):t.assigned_to===userId).length,"#1a1a2e"],["Urgent",tasks.filter(t=>t.priority==="Urgent"&&t.status!=="Done").length,"#dc2626"],["Done",tasks.filter(t=>t.status==="Done").length,"#15803d"],["Overdue",tasks.filter(t=>isOD(t.deadline,t.status)).length,"#ea580c"]].map(([label,val,color])=>
        <div key={label} style={{background:"#fff",borderRadius:14,padding:"12px 8px",textAlign:"center",boxShadow:"0 1px 4px rgba(0,0,0,0.06)"}}>
          <div style={{fontSize:26,fontWeight:900,color,lineHeight:1}}>{val}</div>
          <div style={{fontSize:9,color:"#9ca3af",marginTop:3,fontWeight:700,letterSpacing:"0.7px"}}>{label.toUpperCase()}</div>
        </div>
      )}
    </div>

    {/* TABS */}
    <div style={{padding:"0 20px 14px"}}>
      <div style={{display:"flex",background:"#e5e4df",borderRadius:12,padding:4}}>
        {[["tasks","📋 Tasks"],["chat","💬 Group Chat"]].map(([k,lbl])=>
          <button key={k} className="mbtn" style={{flex:1,padding:"9px 0",border:"none",background:tab===k?"#fff":"transparent",borderRadius:10,fontSize:13,fontWeight:tab===k?700:600,color:tab===k?"#1a1a2e":"#9ca3af",boxShadow:tab===k?"0 1px 4px rgba(0,0,0,0.1)":"none"}} onClick={()=>setTab(k)}>{lbl}</button>
        )}
      </div>
    </div>

    {isAdmin&&<AnnouncementBar userId={userId} profiles={profiles}/>}
    {tab==="tasks"?<div>
      {/* Filters */}
      <div style={{padding:"0 20px 12px",display:"flex",flexDirection:"column",gap:8}}>
        <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
          {["All",...STAT].map(s=><button key={s} className="mbtn"
            style={{padding:"6px 13px",borderRadius:20,border:filterSt===s?"1.5px solid #1a1a2e":"1.5px solid #e5e7eb",background:filterSt===s?"#1a1a2e":"#fff",fontSize:12,fontWeight:filterSt===s?700:500,color:filterSt===s?"#c9a96e":"#6b7280"}}
            onClick={()=>setFilterSt(s)}>{s}</button>)}
        </div>
        <select style={{padding:"8px 12px",borderRadius:10,border:"1.5px solid #e5e7eb",background:"#fff",fontSize:13,color:"#374151",outline:"none"}} value={filterAs} onChange={e=>setFilterAs(e.target.value)}>
          <option value="All">All Members</option>
          {TEAM.map(m=><option key={m.id} value={m.id}>{m.name}</option>)}
        </select>
      </div>

      {/* Task list */}
      <div style={{padding:"0 20px",display:"flex",flexDirection:"column",gap:10,marginBottom:12}}>
        {filtered.length===0&&<div style={{textAlign:"center",padding:"50px 0",color:"#9ca3af"}}><div style={{fontSize:40,marginBottom:10}}>📋</div><div>No tasks found</div></div>}
        {filtered.map(t=><TaskCard key={t.id} task={t} profiles={profiles} onClick={()=>setSelected(t)}/>)}
      </div>

      {isAdmin&&<ProfileManager profiles={profiles} onUpdate={updateProfile}/>}
      {isAdmin&&<button className="mbtn" style={{position:"fixed",bottom:26,right:"max(22px,calc(50vw - 218px))",width:58,height:58,borderRadius:"50%",background:"#1a1a2e",color:"#c9a96e",border:"none",boxShadow:"0 4px 22px rgba(26,26,46,0.45)",fontSize:28,display:"flex",alignItems:"center",justifyContent:"center"}} onClick={()=>setShowNew(true)}>＋</button>}
      {showNew&&<NewTaskModal onClose={()=>setShowNew(false)} onSave={addTask}/>}
      {selected&&<TaskDetail task={tasks.find(t=>t.id===selected.id)||selected} profiles={profiles} userId={userId} isAdmin={isAdmin} onClose={()=>setSelected(null)} onStatusChange={st=>updateTask(selected.id,{status:st})} onDelete={()=>deleteTask(selected.id)} onComment={text=>addComment(selected.id,text)} onEditReq={note=>addEditReq(selected.id,note)} onSign={()=>signTask(selected.id)} onEdit={upd=>updateTask(selected.id,upd)} onAttach={imgs=>updateTask(selected.id,{attachments:imgs})} onLinks={links=>updateTask(selected.id,{links:links})}/>}
    </div>:<Chat messages={chat} onSend={sendChat} userId={userId} profiles={profiles}/>}
  </div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);

// Global Arabic font enforcer - runs after every React render
function applyArabicFont(root){
  const arabicRx=/[؀-ۿݐ-ݿࢠ-ࣿﭐ-﷿ﹰ-﻿]/;
  function walk(node){
    if(node.nodeType===3){// text node
      const txt=node.textContent||"";
      if(arabicRx.test(txt)&&node.parentElement){
        const el=node.parentElement;
        if(!el.style.fontFamily.includes("Alexandria")){
          el.style.fontFamily="'Alexandria',sans-serif";
          el.style.direction="rtl";
          el.style.unicodeBidi="embed";
          el.style.textAlign="right";
        }
      }
    }else{
      node.childNodes.forEach(walk);
    }
  }
  walk(root||document.getElementById("root"));
}

// Run on every DOM mutation (catches all React updates)
const arabicObserver=new MutationObserver(()=>applyArabicFont());
arabicObserver.observe(document.getElementById("root"),{childList:true,subtree:true,characterData:true});
// Run once on load
setTimeout(applyArabicFont,500);
</script>
</body>
</html>
