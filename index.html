<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Muhra HQ</title>
<meta name="description" content="Muhra team hub: content, tasks, briefs, chat, research, ads and publishing in one place">
<meta name="theme-color" content="#F5F0EB">
<script>
/* Theme: saved choice (light / dark) or the device setting. Runs before the page paints. */
(function () {
  var t = ''; try { t = localStorage.getItem('hq-theme') || ''; } catch (e) {}
  if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
  var dark = t === 'dark' || (!t && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
  document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#120E0B' : '#F5F0EB');
})();
</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Muhra HQ">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="https://cdn.shopify.com/s/files/1/0679/6984/3251/files/MUHRA_APP_LOGO_1.png?v=1777552159">
<link rel="apple-touch-icon" href="https://cdn.shopify.com/s/files/1/0679/6984/3251/files/MUHRA_APP_LOGO_1.png?v=1777552159">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<script>
/* Push notifications (OneSignal): links this device to the signed-in member */
window.OneSignalDeferred = window.OneSignalDeferred || [];
OneSignalDeferred.push(async function (OneSignal) {
  try { await OneSignal.init({ appId: '397aeb96-2c45-4cd8-9a5e-da6c2625281b', serviceWorkerPath: '/muhra/OneSignalSDKWorker.js', serviceWorkerParam: { scope: '/muhra/' }, notifyButton: { enable: false } }); }
  catch (e) { console.warn('OneSignal init', e); }
});
/* Saves this device's push subscription for the signed-in member (one row per device). */
window.hqSavePushSub = async function (OneSignal, id) {
  try {
    const ps = OneSignal.User.PushSubscription;
    const sub = ps && ps.id;
    if (!sub || !ps.optedIn || !window.sb) return false;
    const device = (/iPhone|iPad/.test(navigator.userAgent) ? 'iPhone' : /Android/.test(navigator.userAgent) ? 'Android' : 'Computer');
    await window.sb.from('push_tokens').upsert({ user_id: id, token: sub, device, updated_at: new Date().toISOString() });
    return true;
  } catch (e) { console.warn('push save', e); return false; }
};
/* Links this device to the member. Never asks for permission by itself (browsers block that);
   the permission prompt is only opened from a tap, see hqEnablePush in hub/push.js. */
window.registerUserWithOneSignal = function (memberId) {
  const id = String(memberId || '').replace(/[^a-zA-Z0-9_-]/g, ''); if (!id) return;
  window.OneSignalDeferred.push(async function (OneSignal) {
    try {
      if (OneSignal.User.externalId !== id) await OneSignal.login(id);
      await OneSignal.User.addTag('external_id', id);
      if (!window._hqSubListener) {
        window._hqSubListener = true;
        OneSignal.User.PushSubscription.addEventListener('change', () => window.hqSavePushSub(OneSignal, id).then(() => window.hqPushChanged && window.hqPushChanged()));
      }
      if ('Notification' in window && Notification.permission === 'granted') {
        if (!OneSignal.User.PushSubscription.optedIn) await OneSignal.User.PushSubscription.optIn();
        await window.hqSavePushSub(OneSignal, id);
      }
      window.hqPushChanged && window.hqPushChanged();
    } catch (e) { console.warn('push register', e); }
  });
};
</script>
</head>

</body>
