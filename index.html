<head>

<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<script>
/* Push notifications (OneSignal): links this device to the signed-in member */
window.OneSignalDeferred = window.OneSignalDeferred || [];
OneSignalDeferred.push(async function (OneSignal) {
  try { await OneSignal.init({ appId: '397aeb96-2c45-4cd8-9a5e-da6c2625281b', serviceWorkerPath: '/muhra/OneSignalSDKWorker.js', serviceWorkerParam: { scope: '/muhra/' }, notifyButton: { enable: false } }); }
  catch (e) { console.warn('OneSignal init', e); }
});
window.registerUserWithOneSignal = function (memberId) {
  const id = String(memberId || '').replace(/[^a-zA-Z0-9_-]/g, ''); if (!id) return;
  window.OneSignalDeferred.push(async function (OneSignal) {
    try {
      await OneSignal.login(id);
      await OneSignal.User.addTag('external_id', id);
      if ('Notification' in window && Notification.permission === 'default') await Notification.requestPermission();
      if ('Notification' in window && Notification.permission === 'granted') await OneSignal.User.PushSubscription.optIn();
      const sub = OneSignal.User.PushSubscription && (OneSignal.User.PushSubscription.id || OneSignal.User.PushSubscription.token);
      if (sub && window.sb) await window.sb.from('push_tokens').upsert({ user_id: id, token: sub, updated_at: new Date().toISOString() });
    } catch (e) { console.warn('push register', e); }
  });
};
</script>
</head>
<body>
<div id="app"></div>
<div id="sheetRoot"></div>
<input type="file" id="filePick" class="hidden">
<script src="hub/core.js?v=3"></script>
<script src="hub/content.js?v=3"></script>
<script src="hub/work.js?v=3"></script>
<script src="hub/extra.js?v=3"></script>
<script src="hub/team.js?v=3"></script>
<script>window.sb = sb; boot();</script>
</body>
</html>
